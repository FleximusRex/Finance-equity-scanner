<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Equity Factor Lab</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28'%3E%3Crect width='28' height='28' rx='8' fill='%232A78D6'/%3E%3Crect x='7' y='16' width='3.2' height='6' rx='1.6' fill='%23fff'/%3E%3Crect x='12.4' y='11' width='3.2' height='11' rx='1.6' fill='%23fff' opacity='.85'/%3E%3Crect x='17.8' y='6' width='3.2' height='16' rx='1.6' fill='%23fff'/%3E%3C/svg%3E">
<meta name="description" content="Equity Factor Lab: a multi-factor stock ranking and backtest of the S&P 500, explained for beginners and quants.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAFAFA;--surface:#FFFFFF;--ink:#171717;--muted:#525252;--faint:#737373;
  --hairline:rgba(23,23,23,.08);--accent:#2A78D6;--accent-ink:#1F64B8;
  --chip:#F4F4F5;--hover:#F4F4F5;--accent-soft:rgba(42,120,214,.08);
  --q1:#2A78D6;--q2:#7FA9DE;--q3:#B4B4B8;--q4:#E9A27C;--q5:#E0662F;--ew:#5C5C62;--spy:#9A9AA2;
  --warn:#A35A00;--axis:rgba(23,23,23,.28);--grid:rgba(23,23,23,.07);
  --btn:#171717;--btn-ink:#FFFFFF;
  --shadow-hover:0 8px 24px rgba(0,0,0,.06);
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.22,1,.36,1);
  --r:12px;--rc:8px;color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141415;--surface:#19191B;--ink:#EDEDED;--muted:#A1A1A6;--faint:#85858B;
  --hairline:rgba(237,237,237,.08);--accent:#4C93E8;--accent-ink:#7DB2F0;
  --chip:#232325;--hover:#1F1F21;--accent-soft:rgba(76,147,232,.12);
  --q1:#4C93E8;--q2:#6F9AD0;--q3:#8A8A90;--q4:#D98A68;--q5:#E8642F;--ew:#B4B4BA;--spy:#77777D;
  --warn:#F0A54A;--axis:rgba(237,237,237,.28);--grid:rgba(237,237,237,.07);
  --btn:#EDEDED;--btn-ink:#141415;
  --shadow-hover:0 8px 24px rgba(0,0,0,.4);color-scheme:dark;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:120px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,p{margin:0}
b,strong{font-weight:500}
a{color:var(--accent-ink)}
button{font:inherit;color:inherit}
.mono,.num,table{font-family:var(--mono);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1280px;margin:0 auto;padding:0 24px}
.skip{position:absolute;left:-999px;top:8px;background:var(--surface);padding:8px 12px;border-radius:var(--rc);z-index:200}
.skip:focus{left:8px}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--hairline)}
.bar{display:flex;align-items:center;gap:12px;min-height:64px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
.brand{display:flex;align-items:center;gap:8px;font-weight:500;font-size:16px;color:var(--ink);text-decoration:none;white-space:nowrap}
.brand svg{width:28px;height:28px;flex:none}
.tabs{display:flex;gap:4px;margin:0 auto}
.tab{appearance:none;border:0;background:none;color:var(--muted);font:500 14px var(--sans);padding:8px 12px;border-radius:var(--rc);cursor:pointer;display:flex;align-items:center;gap:8px;min-height:36px;white-space:nowrap;transition:color .16s var(--ease),background-color .16s var(--ease)}
.tab:hover{color:var(--ink)}
.tab svg{width:20px;height:20px;display:none}
.tab .sm{display:none}
.tab[aria-selected=true]{color:var(--ink);background:var(--chip);box-shadow:inset 0 0 0 1px var(--hairline)}
.switches{display:flex;gap:8px}
.seg{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--chip);border-radius:10px;padding:4px}
.seg button{position:relative;z-index:1;border:0;background:none;font:500 13px var(--sans);color:var(--muted);padding:4px 12px;border-radius:6px;min-height:32px;cursor:pointer;white-space:nowrap;transition:color .16s var(--ease)}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{color:var(--ink)}
.seg .thumb{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/var(--n,2));background:var(--surface);border-radius:6px;box-shadow:inset 0 0 0 1px var(--hairline);transition:transform .2s var(--ease);transform:translateX(calc(100% * var(--i,0)))}
@media (max-width:1279px){.tabs{order:3;width:100%;margin:0 -12px}.switches{margin-left:auto}}

/* ---------- layout ---------- */
main.wrap{padding-top:40px;padding-bottom:72px;min-height:70vh}
.panel{display:none}
.panel.on{display:block}
.enter{animation:enter .4s var(--ease)}
@keyframes enter{from{opacity:.2;transform:translateY(8px)}to{opacity:1;transform:none}}
.stack>*+*{margin-top:24px}
.eyebrow{font:400 13px/16px var(--sans);color:var(--faint);margin-bottom:8px}
h1{font-size:32px;line-height:1.15;font-weight:500;letter-spacing:-.01em;max-width:32ch}
h2{font-size:18px;line-height:1.35;font-weight:500}
h3{font-size:15px;font-weight:500}
.lede{font-size:16px;line-height:1.6;color:var(--muted);max-width:62ch;margin-top:12px}
p{max-width:65ch}
.muted{color:var(--muted)}
.small{font-size:13px}
.head{margin-bottom:32px}
.card{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r);padding:24px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px}
.kpi{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r);padding:16px 20px}
.kpi .l{font-size:13px;line-height:16px;color:var(--muted)}
.kpi .v{font:500 28px/1.2 var(--mono);margin-top:8px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;line-height:16px;color:var(--faint);margin-top:4px}
.section{margin-top:40px}
.section>h2{margin-bottom:4px}
.section>.sub{color:var(--muted);margin-bottom:16px;font-size:14px}
.chip{display:inline-flex;align-items:center;gap:8px;font:400 12px/16px var(--sans);padding:4px 8px;border-radius:6px;background:var(--chip);color:var(--ink);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.chip i{width:8px;height:8px;border-radius:50%;flex:none}
.chip.wl{background:var(--accent-soft);color:var(--accent-ink)}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:var(--rc);padding:8px 16px;min-height:44px;font:500 14px var(--sans);cursor:pointer;background:var(--btn);color:var(--btn-ink);transition:opacity .16s var(--ease),transform .16s var(--ease)}
.btn:hover{opacity:.88}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--chip);color:var(--ink)}
.iconbtn{border:0;background:none;width:40px;height:40px;border-radius:var(--rc);cursor:pointer;color:var(--muted);display:inline-grid;place-items:center;transition:color .16s var(--ease),background-color .16s var(--ease)}
.iconbtn:hover{background:var(--hover);color:var(--ink)}
.iconbtn svg{width:18px;height:18px}

/* glossary terms + popover */
button.term{background:none;border:0;padding:0;cursor:help;text-decoration:underline dotted;text-decoration-color:var(--faint);text-decoration-thickness:1.5px;text-underline-offset:4px;font:inherit;color:inherit;text-align:inherit;transition:color .16s var(--ease)}
button.term:hover{text-decoration-color:var(--accent);color:var(--accent-ink)}
#pop{position:fixed;z-index:120;max-width:min(300px,calc(100vw - 24px));background:var(--ink);color:var(--bg);border-radius:var(--rc);padding:12px 16px;font-size:13px;line-height:20px;box-shadow:var(--shadow-hover);display:none}
#pop b{display:block;font-size:13px;margin-bottom:4px}
#pop.on{display:block;animation:pop .18s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(4px)}}
.dq{border:0;background:none;padding:0 4px;cursor:help;color:var(--warn);display:inline-flex;align-items:center;gap:4px;font:500 12px var(--sans);vertical-align:middle}
.dq svg{width:16px;height:16px}

/* teaching notes: quiet text blocks, no fill */
.teach{border-top:1px solid var(--hairline);padding-top:16px}
.teach .tl{font:400 13px/16px var(--sans);color:var(--accent-ink);margin-bottom:8px}
.teach p{font-size:14px;line-height:22px;color:var(--muted)}
.teach p b{color:var(--ink)}
.teachgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px 32px}

/* overview */
.hero{padding:0}
.hero h1{font-size:32px;max-width:none}
.answer{display:flex;align-items:center;gap:16px;font-size:48px;line-height:1.1;font-weight:500;letter-spacing:-.02em;margin-top:8px}
.answer svg{width:40px;height:40px;color:var(--faint);flex:none}
.icscale{margin-top:40px;max-width:640px}
.icscale .trk{position:relative;height:8px;border-radius:4px;display:grid;grid-template-columns:2fr 1fr 2fr;gap:4px}
.icscale .trk span{background:var(--chip);border-radius:4px}
.icscale .trk span:nth-child(2){background:var(--hairline)}
.icscale .mk{position:absolute;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:var(--ink);border:4px solid var(--bg)}
.icscale .mkl{position:absolute;bottom:20px;transform:translateX(-50%);font:500 13px var(--mono);white-space:nowrap}
.icscale .zl{display:grid;grid-template-columns:2fr 1fr 2fr;font-size:12px;line-height:16px;color:var(--faint);margin-top:12px;text-align:center}
.icscale .zl span:first-child{text-align:left}.icscale .zl span:last-child{text-align:right}
.take{display:flex;flex-direction:column;gap:12px}
.take .n{font:400 13px/16px var(--sans);color:var(--faint)}
.take .big{font:500 32px/1.1 var(--mono)}
.take .bl{font-size:13px;line-height:20px;color:var(--muted);margin-top:-8px}
.take h3{font-size:16px;line-height:1.35;margin-top:4px}
.take p{font-size:14px;line-height:22px;color:var(--muted)}
.minibars{display:flex;align-items:flex-end;gap:8px;height:56px}
.minibars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.minibars i{display:block;width:100%;max-width:32px;border-radius:4px 4px 0 0;transform-origin:bottom;animation:growy .5s var(--ease) both}
.minibars b{font:400 12px/16px var(--mono);color:var(--faint)}

/* tables */
.tablebox{overflow:auto;border-radius:var(--r);background:var(--surface);border:1px solid var(--hairline);max-width:100%;-webkit-overflow-scrolling:touch}
.tablebox.tall{max-height:70vh}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
th,td{padding:12px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--hairline)}
th{font:500 12px/16px var(--sans);color:var(--muted);background:var(--surface);position:sticky;top:0;z-index:2}
th.l,td.l{text-align:left}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--hover)}
td.stk,th.stk{position:sticky;left:0;z-index:1;background:var(--surface)}
tbody tr:hover td.stk{background:var(--hover)}
th.stk{z-index:3}
th button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
th button:hover{color:var(--ink)}
th button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
th[aria-sort] button::after{content:"";width:0;height:0;border:4px solid transparent;opacity:.0}
th[aria-sort=ascending] button::after{border-bottom-color:currentColor;margin-top:-4px;opacity:1}
th[aria-sort=descending] button::after{border-top-color:currentColor;margin-top:4px;opacity:1}
th[aria-sort] button{color:var(--ink)}
td .tkb{all:unset;cursor:pointer;font-weight:500;color:var(--ink)}
td .tkb:hover{color:var(--accent-ink);text-decoration:underline}
td .tkb:focus-visible{outline:2px solid var(--accent);border-radius:4px}
td.co{max-width:220px;overflow:hidden;text-overflow:ellipsis;font-family:var(--sans)}
tr.gross td{color:var(--faint)}
.tag{font:400 12px/16px var(--sans);padding:0 8px;border-radius:4px;background:var(--chip);color:var(--muted)}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.controls input,.controls select{font:400 14px var(--sans);color:var(--ink);background:var(--surface);border:1px solid var(--hairline);border-radius:var(--rc);padding:0 12px;min-height:44px}
.controls input{flex:1 1 220px;min-width:0}
.controls select{flex:1 1 150px;max-width:260px}
.controls .count{font-size:13px;color:var(--faint);margin-left:auto}

/* rankings basic */
.list h2{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.listhead{display:flex;justify-content:space-between;font-size:12px;line-height:16px;color:var(--faint);padding:8px;border-bottom:1px solid var(--hairline);margin-bottom:4px}
.rrow{display:grid;grid-template-columns:32px minmax(0,1fr) auto;grid-template-areas:"rk who sc" "rk meta sc";align-items:center;gap:4px 12px;padding:12px 8px;border-radius:var(--rc);width:100%;text-align:left;border:0;background:none;cursor:pointer;transition:background-color .16s var(--ease)}
.rrow:hover{background:var(--hover)}
.rrow .rk{grid-area:rk;font:400 13px var(--mono);color:var(--faint)}
.rrow .who{grid-area:who;display:flex;gap:8px;align-items:baseline;min-width:0}
.rrow .tk{font:500 15px var(--mono)}
.rrow .co{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.rrow .meta{grid-area:meta;display:flex;gap:4px;flex-wrap:wrap;min-width:0}
.rrow .sc{grid-area:sc;display:flex;align-items:center;gap:12px}
.mbar{width:72px;height:4px;border-radius:2px;background:var(--chip);overflow:hidden}
.mbar i{display:block;height:100%;border-radius:2px;transform-origin:left;animation:fillx .5s var(--ease) both}
.rrow .pv{font:500 13px var(--mono);min-width:32px;text-align:right}
@keyframes fillx{from{transform:scaleX(0)}}
@keyframes growy{from{transform:scaleY(0)}}

/* lookup */
.combo{position:relative;max-width:560px}
.combo input{width:100%;font:400 16px var(--sans);color:var(--ink);background:var(--surface);border:1px solid var(--hairline);border-radius:10px;padding:0 16px 0 44px;min-height:48px}
.combo>svg{position:absolute;left:16px;top:16px;width:16px;height:16px;color:var(--faint);pointer-events:none}
.combo ul{position:absolute;z-index:30;left:0;right:0;top:56px;margin:0;padding:4px;list-style:none;background:var(--surface);border-radius:12px;box-shadow:var(--shadow-hover);border:1px solid var(--hairline);max-height:340px;overflow:auto}
.combo li{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:8px;cursor:pointer;min-height:44px}
.combo li[aria-selected=true],.combo li:hover{background:var(--hover)}
.combo li b{font:500 14px var(--mono);min-width:56px}
.combo li span{color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.lk{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:24px;margin-top:24px;align-items:start}
.lk .col{display:grid;gap:24px}
.idh{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.idh .tk{font:500 28px/1.1 var(--mono)}
.idh .co{color:var(--muted);font-size:15px;flex-basis:100%}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.gauge{display:block;width:100%;max-width:280px;margin:20px auto 0}
.gauge .trackarc{stroke:var(--chip)}
.gcap{text-align:center;font-size:14px;color:var(--muted);margin-top:8px}
.srank{display:flex;justify-content:center;gap:8px;align-items:baseline;margin-top:16px;font-size:14px}
.srank b{font:500 18px var(--mono)}
.insum{margin-top:20px;padding-top:16px;border-top:1px solid var(--hairline);font-size:14px;line-height:22px}
.cat+.cat{margin-top:20px}
.cat .ch{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px}
.cat .ch b{font:500 14px var(--mono)}
.cat .ch .z{font:400 12px var(--mono);color:var(--faint);margin-left:8px}
.track{position:relative;height:8px;border-radius:4px;background:var(--chip);margin-top:8px;overflow:hidden}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--accent);transform-origin:left;animation:fillx .5s var(--ease) both}
.track.none{background:repeating-linear-gradient(90deg,var(--chip) 0 4px,transparent 4px 8px)}
.track .mid{position:absolute;left:50%;top:-4px;bottom:-4px;width:2px;background:var(--surface)}
.cat .ex{font-size:13px;line-height:20px;color:var(--faint);margin-top:4px}
.mt{width:100%;font-size:14px}
.mt td,.mt th{padding:8px 4px;white-space:normal;position:static}
.mt td:first-child{font-family:var(--sans);text-align:left}
.mt td .ex{display:block;font-size:12px;line-height:16px;color:var(--faint);font-family:var(--sans)}
.mt .cmp{font:400 12px var(--sans);color:var(--muted);white-space:nowrap}
.mt .cmp svg{width:12px;height:12px;vertical-align:-1px}

/* charts */
.chartcard{padding:24px 24px 16px}
.chart{position:relative;width:100%;min-height:200px}
.chart svg{display:block;overflow:visible;touch-action:pan-y}
.chart text{font-family:var(--mono);font-size:11px;fill:var(--faint)}
.chart .lab{fill:var(--ink);font-weight:500;font-size:12px;paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.chart .gridl{stroke:var(--grid);stroke-width:1}
.chart .zero{stroke:var(--axis);stroke-width:1}
.chart .xh{stroke:var(--faint);stroke-width:1;stroke-dasharray:3 3}
.chart .bar{transform-box:fill-box;transform-origin:bottom;animation:growy .5s var(--ease) both}
.chart .bar.neg{transform-origin:top}
.chart .barg:focus{outline:none}
.chart .barg:focus-visible rect,.chart .barg:focus-visible path{stroke:var(--ink);stroke-width:2}
.chart svg:focus{outline:none}
.chart svg:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:4px}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;line-height:20px;color:var(--muted);margin-bottom:12px}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend .ln{width:16px;height:0;border-top:2px solid}
.legend .ln.dash{border-top-style:dashed}
.legend .sq{width:12px;height:12px;border-radius:4px}
.legend .ring{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink)}
.legend .ring.sel{border-color:var(--accent)}
.charthead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:8px 16px;margin-bottom:16px}
.charthead h2{margin-bottom:4px}
#tip{position:fixed;z-index:110;pointer-events:none;background:var(--surface);border:1px solid var(--hairline);box-shadow:var(--shadow-hover);border-radius:var(--rc);padding:8px 12px;font-size:12px;min-width:140px;display:none}
#tip.on{display:block}
#tip .th{color:var(--muted);margin-bottom:4px;font-family:var(--sans)}
#tip .tr{display:grid;grid-template-columns:16px auto 1fr;gap:8px;align-items:center;line-height:1.7}
#tip .tr i{width:16px;height:0;border-top:2px solid}
#tip .tr b{font:500 13px var(--mono);font-variant-numeric:tabular-nums}
#tip .tr span{color:var(--muted)}
.finals{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.final{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r);padding:16px 20px}
.final .l{display:flex;align-items:center;gap:8px;font-size:13px;line-height:16px;color:var(--muted)}
.final .l i{width:16px;height:0;border-top:2px solid}
.final .v{font:500 28px/1.2 var(--mono);margin-top:8px}
.final .s{font-size:12px;line-height:16px;color:var(--faint);margin-top:4px}

/* factor tests */
.fcard h3{font-size:16px}
.verdict{display:flex;align-items:center;gap:8px;font-weight:500;font-size:15px;margin-top:12px}
.verdict svg{width:18px;height:18px;flex:none}
.verdict.yes{color:var(--accent-ink)}
.verdict.weak{color:var(--ink)}
.verdict.no{color:var(--muted)}
.fcard .dir{font-size:14px;margin-top:8px}
.meter{margin-top:16px}
.meter .mh{display:flex;justify-content:space-between;font-size:12px;line-height:16px;color:var(--faint)}
.meter .mh b{font:500 12px var(--mono);color:var(--ink)}
.meter .mt2{position:relative;height:8px;border-radius:4px;background:var(--chip);margin-top:8px}
.meter .mt2 i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--ink);transform-origin:left;animation:fillx .5s var(--ease) both}
.meter .mt2 u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--faint)}
.meter .ml{position:relative;height:16px;font-size:12px;line-height:16px;color:var(--faint);margin-top:4px}
.meter .ml span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.fcard .qq{display:flex;gap:16px;margin-top:16px;padding-top:12px;border-top:1px solid var(--hairline);font-size:13px;color:var(--muted)}
.fcard .qq b{display:block;font:500 16px var(--mono);color:var(--ink)}

/* factor space */
.space{position:relative;height:580px;border-radius:var(--r);background:var(--surface);border:1px solid var(--hairline);overflow:hidden;touch-action:none}
.space canvas{display:block;width:100%;height:100%;cursor:grab;outline:none}
.space canvas:active{cursor:grabbing}
.space canvas:focus-visible{box-shadow:inset 0 0 0 2px var(--accent)}
.space .ov{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.space .ax{position:absolute;left:0;top:0;font:500 12px var(--sans);color:var(--muted);white-space:nowrap}
.space .ax.pos{color:var(--ink)}
.space .ax.corner{font:400 12px/16px var(--sans);color:var(--accent-ink);background:var(--accent-soft);padding:4px 8px;border-radius:6px}
.space .rg{position:absolute;left:0;top:0;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;border:2px solid var(--ink)}
.space .rg.sel{width:28px;height:28px;margin:-14px 0 0 -14px;border-color:var(--accent);border-width:2px}
.space .rg span{position:absolute;left:100%;top:50%;transform:translate(8px,-50%);font:500 12px var(--mono);color:var(--ink);background:var(--surface);padding:0 4px;border-radius:4px;white-space:nowrap}
.space .msg{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:14px;text-align:center;padding:24px}
.space .tools{position:absolute;right:12px;top:12px;display:flex;gap:8px}
.space .tools .iconbtn{background:var(--surface);border:1px solid var(--hairline);width:44px;height:44px}
.space .hint{position:absolute;left:16px;top:12px;font-size:12px;line-height:16px;color:var(--faint);pointer-events:none;max-width:60%}
.space .info{position:absolute;left:12px;bottom:12px;width:300px;max-width:calc(100% - 24px);background:var(--surface);border:1px solid var(--hairline);border-radius:12px;box-shadow:var(--shadow-hover);padding:16px;display:none}
.space .info.on{display:block;animation:pop .2s var(--ease)}
.space .info .ih{display:flex;align-items:baseline;gap:8px;padding-right:32px}
.space .info .ih b{font:500 18px var(--mono)}
.space .info .ih span{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.space .info .x{position:absolute;right:8px;top:8px}
.space .info .zs{font:400 12px var(--mono);color:var(--faint);margin:8px 0 12px}
.space .info .pc{font-size:14px;margin-top:8px}
.space.flat{height:auto;touch-action:auto;padding:16px}

/* footer */
footer{border-top:1px solid var(--hairline);padding:24px 0 32px;color:var(--faint);font-size:13px}
footer .wrap{display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between}

/* ---------------- chart helpers ---------------- */
function nice(lo, hi, count) {
  if (lo === hi) { lo -= 1; hi += 1; }
  const raw = (hi - lo) / count, mag = 10 ** Math.floor(Math.log10(raw)), e = raw / mag;

  return {lo: a, hi: b, ticks};
}

  return out;
}
function pathOf(vals, X, Y) {

  vals.forEach((v, i) => { if (v == null) { pen = false; return; } d += (pen ? "L" : "M") + X(i).toFixed(1) + " " + Y(v).toFixed(1); pen = true; });
  return d;
}

  const t0 = performance.now(), dur = 900;
  const step = t => { const p = Math.max(0, Math.min(1, (t - t0) / dur)), e = 1 - (1 - p) ** 3; r.setAttribute("width", (width * e).toFixed(1)); if (p < 1) requestAnimationFrame(step); };

}

  const every = Math.max(1, Math.ceil(years.length / Math.max(2, Math.floor(iw / 62))));
  const idx = [];
  dates.forEach((d, i) => { if (d.m === 1 && d.y % every === 0) idx.push(i); });
  return idx;
}

/* line chart with crosshair, end labels and draw-in */
function lineChart(el, o) {
  const W = Math.max(260, el.clientWidth), phone = W < 520;
  const H = o.height ?? Math.round(Math.min(400, Math.max(250, W * 0.48)));
  const m = {l: phone ? 46 : 58, r: o.endLabels ? (phone ? 74 : 150) : 14, t: 14, b: 30};
  const iw = W - m.l - m.r, ih = H - m.t - m.b, n = o.dates.length;
  let lo = Infinity, hi = -Infinity;
  o.series.forEach(s => s.v.forEach(v => { if (v != null) { lo = Math.min(lo, v); hi = Math.max(hi, v); } }));
  if (o.zero) { lo = Math.min(lo, 0); hi = Math.max(hi, 0); }
  let Y, yt;
  if (o.log) {
    const a = Math.log10(lo * 0.95), b = Math.log10(hi * 1.05);
    Y = v => m.t + ih - (Math.log10(v) - a) / (b - a) * ih; yt = logTicks(lo * 0.95, hi * 1.05);
  } else {

  }

  if (o.zero && !o.log) s += `<line class="zero" x1="${m.l}" x2="${m.l + iw}" y1="${Y(0)}" y2="${Y(0)}"/>`;

    for (let i = 1; i < L.length; i++) if (L[i].y < L[i - 1].y + 16) L[i].y = L[i - 1].y + 16;

/* vertical bar chart with reference lines */

/* monthly IC bars + rolling mean line */
function icChart(el, u) {

  xTicks(dates, iw).forEach(i => { s += `<text x="${X(i)}" y="${H - 8}" text-anchor="middle">${phone ? "’" + String(dates[i].y).slice(2) : dates[i].y}</text>`; });

  ic.forEach((v, i) => { if (v == null) return; const y0 = Y(0), y1 = Y(v); s += `<rect class="bar${v < 0 ? " neg" : ""}" x="${(X(i) - bw / 2).toFixed(2)}" y="${Math.min(y0, y1).toFixed(1)}" width="${bw.toFixed(2)}" height="${Math.max(0.5, Math.abs(y1 - y0)).toFixed(1)}" opacity=".75" style="fill:${v >= 0 ? "var(--q1)" : "var(--q5)"};animation-delay:${RM ? 0 : Math.round(i * 3)}ms"/>`; });
  s += `</g><path d="${pathOf(roll, X, Y)}" fill="none" style="stroke:var(--ink)" stroke-width="2" stroke-linejoin="round"/>`;
  s += `<g class="hover" style="display:none"><line class="xh" y1="${m.t}" y2="${m.t + ih}"/></g><rect x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent"/></svg>`;
  el.innerHTML = s;
  const svg = el.firstChild, hg = svg.querySelector(".hover"), xl = hg.firstChild;
  let idx = -1;
  const show = (i, cx, cy) => {
    idx = Math.max(0, Math.min(n - 1, i)); hg.style.display = ""; xl.setAttribute("x1", X(idx)); xl.setAttribute("x2", X(idx));
    const html = `<div class="th">${mlab(dates[idx])}</div><div class="tr"><i style="border-color:${(ic[idx] ?? 0) >= 0 ? "var(--q1)" : "var(--q5)"}"></i><b>${F.n3(ic[idx])}</b><span>Monthly IC</span></div><div class="tr"><i style="border-color:var(--ink)"></i><b>${F.n3(roll[idx])}</b><span>12-month avg</span></div>`;
    const b = svg.getBoundingClientRect(); showTip(html, cx ?? b.left + X(idx), cy ?? b.top + 30);
  };
  svg.addEventListener("pointermove", e => { const b = svg.getBoundingClientRect(); show(Math.floor((e.clientX - b.left - m.l) / band), e.clientX, e.clientY); });
  svg.addEventListener("pointerleave", () => { hg.style.display = "none"; hideTip(); });
  svg.addEventListener("blur", () => { hg.style.display = "none"; hideTip(); });
  svg.addEventListener("focus", () => show(idx < 0 ? n - 1 : idx));
  svg.addEventListener("keydown", e => { if (e.key === "ArrowRight" || e.key === "ArrowLeft") { e.preventDefault(); show((idx < 0 ? n - 1 : idx) + (e.key === "ArrowRight" ? 1 : -1)); } });
}

const BT_SERIES = [["Q1", "Q1_net"], ["Q5", "Q5_net"], ["EW", "EW_net"], ["SPY", "SPY"]];

  const u = cur(), dates = [u.rm[0], ...u.hold], yrs = (u.hold.length / 12).toFixed(0);
  const finals = BT_SERIES.map(([k, c]) => ({k, v: growth(u, c).at(-1), cagr: (u.S[c] || u.S[k])?.CAGR}));
  const qs = [1, 2, 3, 4, 5].map(i => u.S["Q" + i + "_net"]?.CAGR);
  const stair = qs.every((v, i) => i === 0 || v < qs[i - 1]);
  after(() => {
    chartJob("#bt-growth", el => lineChart(el, {key: "growth" + (state.log ? "L" : ""), dates, log: state.log, endLabels: true, aria: `Growth of $10,000 from ${mlab(dates[0])} to ${mlab(dates.at(-1))}, net of costs: ` + finals.map(f => `${SERIES[f.k].end} ${F.usd(f.v)}`).join(", ") + ". Use left and right arrow keys to read values.",
      series: BT_SERIES.map(([k, c]) => ({...SERIES[k], v: growth(u, c)})), yFmt: F.usdk, yFmtEnd: F.usdk, yFmtTip: F.usd}));
    chartJob("#bt-stairs", el => barChart(el, {aria: "Yearly return (CAGR, net) by quintile: " + qs.map((v, i) => `Q${i + 1} ${F.pct1(v)}`).join(", "), tipLabel: "CAGR, net",
      bars: qs.map((v, i) => ({label: "Q" + (i + 1), sub: i === 0 ? "Top 20%" : i === 4 ? "Bottom 20%" : "", subS: i === 0 ? "Top" : i === 4 ? "Bottom" : "", v, color: `var(--q${i + 1})`})),
      refs: [{label: "All stocks, equal-weight", v: u.S.EW_net?.CAGR, color: "var(--ew)"}, {label: "SPY", v: u.S.SPY?.CAGR, color: "var(--spy)"}], fmt: F.pct1, yFmt: F.pct0, sub: true}));
    if (!basic()) {
      chartJob("#bt-dd", el => lineChart(el, {key: "dd", dates, zero: true, endLabels: true, height: Math.round(Math.min(300, Math.max(220, el.clientWidth * 0.32))), aria: "Drawdown from previous peak over time, net of costs: max drawdowns " + BT_SERIES.map(([k, c]) => `${SERIES[k].end} ${F.pct1((u.S[c] || u.S[k])?.MaxDD)}`).join(", "),
        series: BT_SERIES.map(([k, c]) => ({...SERIES[k], v: ddOf(growth(u, c))})), yFmt: F.pct0, yFmtEnd: F.pct0, yFmtTip: F.pct1}));
      $("#bt-log")?.addEventListener("click", e => { state.log = !state.log; e.currentTarget.setAttribute("aria-pressed", state.log); e.currentTarget.textContent = state.log ? "Log scale: on" : "Log scale: off"; chartJobs[0](); });
    }
  });
  const M = u.M, rows = u.hold.map((d, i) => i).reverse();
  return `<div class="head"><p class="eyebrow">Backtest · ${UNI_NAME[u.key]}</p><h1>${basic() ? `What would $10,000 have become?` : "Quintile backtest, net of costs"}</h1>
  <p class="lede">${basic() ? `Imagine putting $10,000 into each portfolio in ${mlab(dates[0])} and re-sorting the stocks every month for ${yrs} years, after trading costs.` : `Equal-weighted quintiles on the price-only composite, monthly ${T("rebalance")}, ${T("net")} of 10 bps per side. Growth of $10,000; hover or use arrow keys for values.`}</p></div>
  ${basic() ? `<div class="finals">${finals.map(f => `<div class="final"><div class="l"><i style="border-color:${SERIES[f.k].color};${SERIES[f.k].dash ? "border-top-style:dashed" : ""}"></i>${SERIES[f.k].end}</div><div class="v">${countEl(f.v, "usd", "f" + f.k)}</div><div class="s">${F.pct1(f.cagr)} a year</div></div>`).join("")}</div>` : ""}
  <section class="card chartcard section" style="margin-top:${basic() ? 20 : 0}px"><div class="charthead"><div><h2>Growth of $10,000</h2><p class="muted small">Net of trading costs · ${mlab(dates[0])} – ${mlab(dates.at(-1))}</p></div>${!basic() ? `<button type="button" class="btn ghost" id="bt-log" aria-pressed="${state.log}">Log scale: ${state.log ? "on" : "off"}</button>` : ""}</div>
    ${legend(["Q1", "Q5", "EW", "SPY"])}<div class="chart" id="bt-growth"></div></section>
  <section class="card chartcard section"><div class="charthead"><div><h2>The staircase test</h2><p class="muted small">${T("cagr", "Yearly return (CAGR)")} by quintile, net. ${stair ? "Returns step down from Q1 to Q5." : "A working score would make these bars step down from Q1 to Q5; they don't."}</p></div></div>
    <div class="chart" id="bt-stairs"></div></section>
  ${basic() ? `<section class="section teachgrid">
    ${teach("CAGR", `Compound annual growth rate is the steady yearly return that turns $10,000 into the final amount. ${F.pct1(finals[0].cagr)} a year for ${yrs} years is how the top 20% reached ${F.usd(finals[0].v)}.`)}
    ${teach("Sharpe ratio", `Return per unit of risk: yearly return divided by how much it swings. The top 20% scored ${F.n2(u.S.Q1_net?.Sharpe)} vs ${F.n2(u.S.SPY?.Sharpe)} for SPY. Above 1 is considered good for a stock portfolio.`)}
    ${teach("Max drawdown", `The worst peak-to-low fall along the way. The bottom 20% once fell ${F.pct0(Math.abs(u.S.Q5_net?.MaxDD ?? 0))} from its high; SPY's worst was ${F.pct0(Math.abs(u.S.SPY?.MaxDD ?? 0))}. Bigger drawdowns are harder to sit through.`)}
  </section>` : `<section class="card chartcard section"><div class="charthead"><div><h2>${T("drawdown", "Drawdown")}</h2><p class="muted small">Distance below the previous peak, net</p></div></div>${legend(["Q1", "Q5", "EW", "SPY"])}<div class="chart" id="bt-dd"></div></section>
  <section class="section"><h2>Monthly returns</h2><p class="sub">Net returns for the month after each rebalance, newest first. IC = rank IC of the composite that month.</p>
    <div class="tablebox tall"><table aria-label="Monthly returns"><thead><tr><th class="l stk" scope="col">Month</th>${["Q1", "Q2", "Q3", "Q4", "Q5"].map(q => `<th scope="col">${q}</th>`).join("")}<th scope="col">EW</th><th scope="col">L/S</th><th scope="col">SPY</th><th scope="col">IC</th></tr></thead>
    <tbody>${rows.map(i => `<tr><td class="l stk">${mlab(u.hold[i])}</td>${["Q1", "Q2", "Q3", "Q4", "Q5", "EW", "LS"].map(q => `<td>${F.pct1(M[q + "_net"]?.[i])}</td>`).join("")}<td>${F.pct1(M.SPY?.[i])}</td><td>${F.n3(M.IC?.[i])}</td></tr>`).join("")}</tbody></table></div></section>`}`;
};

/* ---------------- 6. factor tests ---------------- */
const FT = {
  mom_12_1: {b: "Momentum (12 months)", a: "12-1M momentum", ex: "Stocks that rose over the past year, skipping the latest month.", risk: false},
  ret_6m: {b: "Momentum (6 months)", a: "6M momentum", ex: "Stocks that rose over the past six months.", risk: false},
  vol_60d: {b: "Low volatility", a: "60D volatility (inv.)", ex: "Calmer stocks with smaller daily price swings.", risk: true},
  beta: {b: "Low beta", a: "Beta vs SPY (inv.)", ex: "Stocks that move less than the market.", risk: true},
  composite: {b: "Combined model score", a: "Composite (mom + low vol)", ex: "The backtest blend of momentum and low volatility.", risk: false},
};
function verdict(p) { return p < 0.05 ? ["yes", "Reliable signal"] : p < 0.10 ? ["weak", "Weak hint"] : ["no", "No reliable signal"]; }
function direction(t, ft) {
  if (t.IC_mean >= 0) return ft.risk ? "Pointed the textbook way: calmer stocks did a bit better." : "Pointed the right way, but only slightly.";
  return ft.risk ? "Pointed the wrong way: jumpier stocks did better." : "Pointed the wrong way: higher scores did slightly worse.";
}
R.tests = () => {
  const u = cur(), tests = u.tests;
  if (basic()) return `<div class="head"><p class="eyebrow">Factor Tests · ${UNI_NAME[u.key]}</p><h1>Does any single signal work?</h1>
  <p class="lede">Each price-based ${T("factor")} was tested on its own for ${u.T.composite?.Months ?? tests[0]?.Months ?? ""} months. The meter shows signal strength; a reliable signal needs to pass the line.</p></div>
  <div class="grid3">${tests.map(t => { const ft = FT[t.factor] || {b: t.factor, ex: ""}, [cls, txt] = verdict(t.IC_p), at = Math.abs(t.IC_t), w = Math.min(100, at / 3 * 100);
    return `<article class="card fcard"><h3>${esc(ft.b)}</h3><p class="muted small" style="margin-top:4px">${esc(ft.ex)}</p>
      <div class="verdict ${cls}">${ico(cls)}${txt}</div><p class="dir">${direction(t, ft)}</p>
      <div class="meter"><div class="mh"><span>Signal strength</span><b>${F.n2(at)} / 2.0 needed</b></div>
        <div class="mt2" role="meter" aria-valuemin="0" aria-valuemax="3" aria-valuenow="${at.toFixed(2)}" aria-label="Signal strength ${F.n2(at)}; about 2 is needed to be reliable"><i style="width:${w}%"></i><u style="left:${1.96 / 3 * 100}%"></u></div>
        <div class="ml"><span style="left:0;transform:none">none</span><span style="left:${1.96 / 3 * 100}%">reliable</span></div></div>
      <div class="qq"><div><b>${F.pct1(t.Q1_CAGR)}</b>Top 20% / yr</div><div><b>${F.pct1(t.Q5_CAGR)}</b>Bottom 20% / yr</div><div><b>${F.n2(t.IC_p)}</b>${T("pvalue")}</div></div></article>`; }).join("")}</div>
  <section class="section teachgrid">
    ${teach("Rank IC", `Each month, rank stocks by score and by next month's return, then measure how well the two rankings agree. +1 is perfect, 0 is no link, −1 is perfectly backwards. Even good real-world factors only reach about 0.03–0.05.`)}
    ${teach("p-value", `The chance of seeing a link this strong if the factor were pure noise. A p-value of 0.80 means noise would do this well 80% of the time; researchers usually want below 0.05 before trusting a signal.`)}
  </section>`;
  return `<div class="head"><p class="eyebrow">Factor Tests · ${UNI_NAME[u.key]}</p><h1>Single-factor tests</h1>
  <p class="lede">Each price factor run through the same quintile backtest. ${T("ic", "Rank IC")} = Spearman correlation of score vs next-month return; ${T("tstat", "t")} and ${T("pvalue", "p")} from a one-sample t-test on the monthly IC series.</p></div>
  <div class="tablebox"><table aria-label="Single-factor test results"><thead><tr><th class="l stk" scope="col">Factor</th><th class="l" scope="col">Verdict</th><th scope="col">Mean IC</th><th scope="col">t-stat</th><th scope="col">p-value</th><th scope="col">Q1 CAGR</th><th scope="col">Q5 CAGR</th><th scope="col">${T("longshort", "L/S CAGR")}</th><th scope="col">Months</th></tr></thead>
  <tbody>${tests.map(t => { const [cls, txt] = verdict(t.IC_p); return `<tr><td class="l stk" style="font-family:var(--sans)">${esc((FT[t.factor] || {}).a || t.factor)}</td><td class="l" style="font-family:var(--sans)"><span class="verdict ${cls}" style="margin:0;font-size:13px;font-weight:500">${ico(cls)}${txt}</span></td><td>${F.n3(t.IC_mean)}</td><td>${F.n2(t.IC_t)}</td><td>${F.n3(t.IC_p)}</td><td>${F.pct1(t.Q1_CAGR)}</td><td>${F.pct1(t.Q5_CAGR)}</td><td>${F.pct1(t.LS_CAGR)}</td><td>${F.int(t.Months)}</td></tr>`; }).join("")}</tbody></table></div>
  <section class="card chartcard section"><div class="charthead"><div><h2>Monthly rank IC, composite</h2><p class="muted small">Bars = monthly IC; line = 12-month rolling mean. Mean ${F.n3(u.T.composite?.IC_mean)}, t = ${F.n2(u.T.composite?.IC_t)}.</p></div></div>
    <div class="legend"><span><i class="sq" style="background:var(--q1);opacity:.75"></i>Positive (scores right)</span><span><i class="sq" style="background:var(--q5);opacity:.75"></i>Negative (scores wrong way)</span><span><i class="ln" style="border-color:var(--ink)"></i>12-month mean</span></div>
    <div class="chart" id="ic-chart"></div></section>`;
};

/* ---------------- wiring ---------------- */
function postRender() {
  if (state.tab === "rankings" && !basic()) {
    rkBody();
    $("#rk-q").addEventListener("input", e => { state.rk.q = e.target.value; rkBody(); });
    $("#rk-sector").addEventListener("change", e => { state.rk.sector = e.target.value; rkBody(); });
    $("#rk-quint").addEventListener("change", e => { state.rk.quint = e.target.value; rkBody(); });
    $$("#p-rankings th[data-k] button").forEach(b => b.addEventListener("click", () => { const k = b.parentElement.dataset.k; if (state.rk.sort === k) state.rk.dir *= -1; else { state.rk.sort = k; state.rk.dir = RCOLS.find(c => c.k === k).s || k === "Rank" ? 1 : -1; } rkBody(); }));
  }
  if (state.tab === "lookup") lookupWire();
  if (state.tab === "space") spaceMount();
  if (state.tab === "tests" && !basic()) chartJob("#ic-chart", el => icChart(el, cur()));
}
function openStock(t) { state.stock = t; setTab("lookup"); }
document.addEventListener("click", e => { const b = e.target.closest("[data-open]"); if (b) { openStock(b.dataset.open); } });

function buildTabs() {
  $("#tabs").innerHTML = TABS.map(t => `<button type="button" class="tab" role="tab" id="t-${t.id}" aria-controls="p-${t.id}" data-tab="${t.id}">${ico(t.id)}<span class="lg">${t.lg}</span><span class="sm">${t.sm}</span></button>`).join("");
  $$(".tab").forEach(b => b.addEventListener("click", () => setTab(b.dataset.tab)));
  $("#tabs").addEventListener("keydown", e => {
    const i = TAB_IDS.indexOf(state.tab);
    if (e.key === "ArrowRight" || e.key === "ArrowLeft") { e.preventDefault(); const n = TAB_IDS[(i + (e.key === "ArrowRight" ? 1 : TAB_IDS.length - 1)) % TAB_IDS.length]; setTab(n); $("#t-" + n).focus(); }
  });
}
function syncChrome() {
  $$(".tab").forEach(b => { const on = b.dataset.tab === state.tab; b.setAttribute("aria-selected", on); b.tabIndex = on ? 0 : -1; });
  [["#seg-mode", state.mode], ["#seg-uni", state.uni]].forEach(([s, v]) => {
    const seg = $(s), bs = $$("button", seg), i = bs.findIndex(b => b.dataset.v === v);
    bs.forEach(b => b.setAttribute("aria-pressed", b.dataset.v === v)); seg.style.setProperty("--i", Math.max(0, i)); seg.style.setProperty("--n", bs.length);
  });
}
function setTab(t) {
  if (!TAB_IDS.includes(t)) return;
  state.tab = t; store.set("efl.tab", t); syncChrome();
  try { history.replaceState(null, "", "#" + t); } catch (e) {}
  render(); window.scrollTo({top: 0});
}
function bindSeg(sel, fn) { $$(sel + " button").forEach(b => b.addEventListener("click", () => fn(b.dataset.v))); }
bindSeg("#seg-mode", v => { if (v === state.mode) return; state.mode = v; store.set("efl.mode", v); syncChrome(); render(); });
bindSeg("#seg-uni", v => { if (v === state.uni || !U[v]) return; state.uni = v; store.set("efl.uni", v); if (!U[v].by[state.stock]) state.stock = null; state.rk.sector = ""; syncChrome(); render(); });
UNIS.length < 2 && ($("#seg-uni").style.display = "none");
$(".brand").addEventListener("click", e => { e.preventDefault(); setTab("overview"); });
addEventListener("hashchange", () => { const t = location.hash.slice(1); if (TAB_IDS.includes(t) && t !== state.tab) setTab(t); });
let rzT = 0, lastW = innerWidth;
addEventListener("resize", () => { clearTimeout(rzT); rzT = setTimeout(() => { if (innerWidth === lastW) return; lastW = innerWidth; hideTip(); chartJobs.forEach(f => f()); }, 160); });
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => { if (state.tab === "space") render(false); });

buildTabs(); syncChrome(); render();
</script>
</body>
</html>
