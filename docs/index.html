<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Equity Factor Lab</title>
<meta name="description" content="Equity Factor Lab: a multi-factor stock ranking and backtest of the S&P 500, explained for beginners and quants.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F7FA;--surface:#FFFFFF;--ink:#0F1B2D;--muted:#5B6B82;--hairline:#E3E8EF;--accent:#2A78D6;
  --chip:#EBEFF5;--hover:#F0F3F8;--accent-soft:rgba(42,120,214,.09);--accent-ink:#1F64B8;
  --q1:#2A78D6;--q2:#6E9EDB;--q3:#A0A8B4;--q4:#EE9468;--q5:#EB6834;--ew:#1BAF7A;--spy:#7F8A9C;
  --warn:#A35A00;--axis:#B7C1CF;--grid:#E3E8EF;
  --shadow:0 1px 2px rgba(15,27,45,.04),0 6px 20px rgba(15,27,45,.06);
  --shadow-hover:0 2px 4px rgba(15,27,45,.06),0 14px 32px rgba(15,27,45,.10);
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:14px;color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0B1220;--surface:#131C2E;--ink:#EEF2F8;--muted:#9AA8BD;--hairline:#24314A;--accent:#4C93E8;
  --chip:#1C2740;--hover:#1A2438;--accent-soft:rgba(76,147,232,.13);--accent-ink:#7DB2F0;
  --q1:#4C93E8;--q2:#6F9AD0;--q3:#8892A3;--q4:#D98A68;--q5:#E8642F;--ew:#1BAF7A;--spy:#8C99AD;
  --warn:#F0A54A;--axis:#3A4A66;--grid:#22304A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  --shadow-hover:0 2px 4px rgba(0,0,0,.35),0 14px 32px rgba(0,0,0,.35);color-scheme:dark;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:120px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,p{margin:0}
a{color:var(--accent-ink)}
button{font:inherit;color:inherit}
.mono,.num,table{font-family:var(--mono);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1240px;margin:0 auto;padding:0 24px}
.skip{position:absolute;left:-999px;top:8px;background:var(--surface);padding:8px 12px;border-radius:8px;z-index:200}
.skip:focus{left:8px}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:saturate(1.5) blur(14px);backdrop-filter:saturate(1.5) blur(14px);border-bottom:1px solid var(--hairline)}
.bar{display:flex;align-items:center;gap:12px;min-height:64px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px;color:var(--ink);text-decoration:none;letter-spacing:-.01em;white-space:nowrap}
.brand svg{width:28px;height:28px;flex:none}
.tabs{display:flex;gap:2px;margin:0 auto}
.tab{appearance:none;border:0;background:none;color:var(--muted);font:500 14px var(--sans);padding:8px 10px;border-radius:10px;cursor:pointer;display:flex;align-items:center;gap:8px;min-height:40px;white-space:nowrap;transition:color .2s ease-out,background-color .2s ease-out}
.tab:hover{color:var(--ink)}
.tab svg{width:22px;height:22px;display:none}
.tab .sm{display:none}
.tab[aria-selected=true]{color:var(--ink);background:var(--surface);box-shadow:var(--shadow)}
.switches{display:flex;gap:8px}
.seg{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--chip);border-radius:11px;padding:3px}
.seg button{position:relative;z-index:1;border:0;background:none;font:500 13px var(--sans);color:var(--muted);padding:6px 10px;border-radius:8px;min-height:34px;cursor:pointer;white-space:nowrap;transition:color .2s ease-out}
.seg button[aria-pressed=true]{color:var(--ink)}
.seg .thumb{position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/var(--n,2));background:var(--surface);border-radius:8px;box-shadow:0 1px 3px rgba(15,27,45,.12);transition:transform .25s ease-out;transform:translateX(calc(100% * var(--i,0)))}
@media (max-width:1239px){.tabs{order:3;width:100%;margin:0 -10px}.switches{margin-left:auto}}

/* ---------- layout ---------- */
main.wrap{padding-top:36px;padding-bottom:72px;min-height:70vh}
.panel{display:none}
.panel.on{display:block}
.enter{animation:enter .34s ease-out}
@keyframes enter{from{opacity:.2;transform:translateY(8px)}to{opacity:1;transform:none}}
.stack>*+*{margin-top:24px}
.eyebrow{font:600 12px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-size:30px;line-height:1.2;font-weight:600;letter-spacing:-.02em;max-width:24ch}
h2{font-size:18px;line-height:1.35;font-weight:600;letter-spacing:-.01em}
h3{font-size:15px;font-weight:600}
.lede{font-size:17px;color:var(--muted);max-width:62ch;margin-top:10px}
p{max-width:65ch}
.muted{color:var(--muted)}
.small{font-size:13px}
.head{margin-bottom:28px}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:22px}
@media (hover:hover){.lift{transition:transform .2s ease-out,box-shadow .2s ease-out}.lift:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover)}}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.kpi{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px}
.kpi .l{font-size:13px;color:var(--muted)}
.kpi .v{font:600 28px/1.2 var(--mono);letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.section{margin-top:40px}
.section>h2{margin-bottom:6px}
.section>.sub{color:var(--muted);margin-bottom:16px;font-size:14px}
.chip{display:inline-flex;align-items:center;gap:6px;font:500 12px/1.4 var(--sans);padding:3px 10px;border-radius:999px;background:var(--chip);color:var(--ink);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.chip i{width:8px;height:8px;border-radius:50%;flex:none}
.chip.wl{background:var(--accent-soft);color:var(--accent-ink)}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:10px;padding:10px 16px;min-height:44px;font:500 14px var(--sans);cursor:pointer;background:var(--accent);color:#fff;transition:filter .2s ease-out}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--chip);color:var(--ink)}
.iconbtn{border:0;background:none;width:40px;height:40px;border-radius:10px;cursor:pointer;color:var(--muted);display:inline-grid;place-items:center}
.iconbtn:hover{background:var(--hover);color:var(--ink)}
.iconbtn svg{width:18px;height:18px}

/* glossary terms + popover */
button.term{background:none;border:0;padding:0;cursor:help;text-decoration:underline dotted;text-decoration-color:var(--muted);text-decoration-thickness:1.5px;text-underline-offset:3px;font:inherit;color:inherit;text-align:inherit}
button.term:hover{text-decoration-color:var(--accent);color:var(--accent-ink)}
#pop{position:fixed;z-index:120;max-width:min(300px,calc(100vw - 24px));background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.5;box-shadow:var(--shadow-hover);display:none}
#pop b{display:block;font-size:13px;margin-bottom:2px}
#pop.on{display:block;animation:pop .18s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(4px)}}
.dq{border:0;background:none;padding:0 2px;cursor:help;color:var(--warn);display:inline-flex;align-items:center;gap:4px;font:500 12px var(--sans);vertical-align:middle}
.dq svg{width:15px;height:15px}

/* teaching callouts */
.teach{background:var(--accent-soft);border-radius:var(--r);padding:16px 18px;display:grid;align-content:start;grid-template-columns:28px minmax(0,1fr);gap:4px 10px;align-items:start}
.teach svg{width:22px;height:22px;color:var(--accent-ink);margin-top:1px}
.teach .tl{font:600 12px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink)}
.teach p{grid-column:2;font-size:14.5px}
.teachgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}

/* overview */
.hero{padding:8px 0 4px}
.hero h1{font-size:34px;max-width:none}
.answer{display:flex;align-items:center;gap:14px;font-size:52px;line-height:1.1;font-weight:600;letter-spacing:-.03em;margin-top:6px}
.answer svg{width:44px;height:44px;color:var(--muted);flex:none}
.icscale{margin-top:26px;max-width:640px}
.icscale .trk{position:relative;height:10px;border-radius:5px;display:grid;grid-template-columns:2fr 1fr 2fr;gap:3px}
.icscale .trk span{background:var(--chip);border-radius:5px}
.icscale .trk span:nth-child(2){background:var(--hairline)}
.icscale .mk{position:absolute;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:var(--ink);border:3px solid var(--surface);box-shadow:0 0 0 1px var(--ink)}
.icscale .mkl{position:absolute;bottom:18px;transform:translateX(-50%);font:600 13px var(--mono);white-space:nowrap}
.icscale .zl{display:grid;grid-template-columns:2fr 1fr 2fr;font-size:12px;color:var(--muted);margin-top:8px;text-align:center}
.icscale .zl span:first-child{text-align:left}.icscale .zl span:last-child{text-align:right}
.take{display:flex;flex-direction:column;gap:10px}
.take .n{font:600 12px var(--sans);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.take .big{font:600 34px/1.1 var(--mono);letter-spacing:-.02em}
.take .bl{font-size:13px;color:var(--muted);margin-top:-6px}
.take h3{font-size:16px;line-height:1.35;margin-top:4px}
.take p{font-size:14px;color:var(--muted)}
.minibars{display:flex;align-items:flex-end;gap:6px;height:56px;margin-top:2px}
.minibars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.minibars i{display:block;width:100%;max-width:30px;border-radius:4px 4px 1px 1px;transform-origin:bottom;animation:growy .5s ease-out both}
.minibars b{font:500 10px var(--mono);color:var(--muted)}

/* tables */
.tablebox{overflow:auto;border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow);max-width:100%;-webkit-overflow-scrolling:touch}
.tablebox.tall{max-height:70vh}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
th,td{padding:10px 12px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--hairline)}
th{font:600 12px var(--sans);color:var(--muted);background:var(--surface);position:sticky;top:0;z-index:2}
th.l,td.l{text-align:left}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--hover)}
td.stk,th.stk{position:sticky;left:0;z-index:1;background:var(--surface)}
th.stk{z-index:3}
th button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
th button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
th[aria-sort] button::after{content:"";width:0;height:0;border:4px solid transparent;opacity:.0}
th[aria-sort=ascending] button::after{border-bottom-color:currentColor;margin-top:-4px;opacity:1}
th[aria-sort=descending] button::after{border-top-color:currentColor;margin-top:4px;opacity:1}
td .tkb{all:unset;cursor:pointer;font-weight:600;color:var(--ink)}
td .tkb:hover{color:var(--accent-ink);text-decoration:underline}
td .tkb:focus-visible{outline:2px solid var(--accent);border-radius:3px}
td.co{max-width:220px;overflow:hidden;text-overflow:ellipsis;font-family:var(--sans)}
tr.gross td{color:var(--muted)}
.tag{font:500 11px var(--sans);padding:1px 7px;border-radius:999px;background:var(--chip);color:var(--muted)}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.controls input,.controls select{font:400 14px var(--sans);color:var(--ink);background:var(--surface);border:1px solid var(--hairline);border-radius:10px;padding:0 12px;min-height:42px}
.controls input{flex:1 1 220px;min-width:0}
.controls select{flex:1 1 150px;max-width:260px}
.controls .count{font-size:13px;color:var(--muted);margin-left:auto}

/* rankings basic */
.list h2{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.listhead{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--hairline);margin-bottom:4px}
.rrow{display:grid;grid-template-columns:30px minmax(0,1fr) auto;grid-template-areas:"rk who sc" "rk meta sc";align-items:center;gap:3px 12px;padding:10px 8px;border-radius:10px;width:100%;text-align:left;border:0;background:none;cursor:pointer;transition:background-color .2s ease-out}
.rrow:hover{background:var(--hover)}
.rrow .rk{grid-area:rk;font:500 13px var(--mono);color:var(--muted)}
.rrow .who{grid-area:who;display:flex;gap:8px;align-items:baseline;min-width:0}
.rrow .tk{font:600 15px var(--mono)}
.rrow .co{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.rrow .meta{grid-area:meta;display:flex;gap:6px;flex-wrap:wrap;min-width:0}
.rrow .sc{grid-area:sc;display:flex;align-items:center;gap:10px}
.mbar{width:72px;height:6px;border-radius:3px;background:var(--chip);overflow:hidden}
.mbar i{display:block;height:100%;border-radius:3px;transform-origin:left;animation:fillx .6s ease-out both}
.rrow .pv{font:500 13px var(--mono);min-width:30px;text-align:right}
@keyframes fillx{from{transform:scaleX(0)}}
@keyframes growy{from{transform:scaleY(0)}}

/* lookup */
.combo{position:relative;max-width:560px}
.combo input{width:100%;font:400 16px var(--sans);color:var(--ink);background:var(--surface);border:1px solid var(--hairline);border-radius:12px;padding:0 14px 0 44px;min-height:50px;box-shadow:var(--shadow)}
.combo>svg{position:absolute;left:14px;top:15px;width:20px;height:20px;color:var(--muted);pointer-events:none}
.combo ul{position:absolute;z-index:30;left:0;right:0;top:56px;margin:0;padding:6px;list-style:none;background:var(--surface);border-radius:12px;box-shadow:var(--shadow-hover);border:1px solid var(--hairline);max-height:340px;overflow:auto}
.combo li{display:flex;align-items:center;gap:10px;padding:10px;border-radius:8px;cursor:pointer;min-height:44px}
.combo li[aria-selected=true],.combo li:hover{background:var(--hover)}
.combo li b{font:600 14px var(--mono);min-width:56px}
.combo li span{color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.lk{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:20px;margin-top:24px;align-items:start}
.lk .col{display:grid;gap:20px}
.idh{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px}
.idh .tk{font:600 30px/1.1 var(--mono);letter-spacing:-.02em}
.idh .co{color:var(--muted);font-size:15px;flex-basis:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.gauge{display:block;width:100%;max-width:280px;margin:18px auto 0}
.gauge .trackarc{stroke:var(--chip)}
.gcap{text-align:center;font-size:14px;color:var(--muted);margin-top:-2px}
.srank{display:flex;justify-content:center;gap:8px;align-items:baseline;margin-top:14px;font-size:14px}
.srank b{font:600 18px var(--mono)}
.insum{margin-top:18px;padding-top:16px;border-top:1px solid var(--hairline);font-size:14.5px}
.cat+.cat{margin-top:16px}
.cat .ch{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px}
.cat .ch b{font:600 14px var(--mono)}
.cat .ch .z{font:400 12px var(--mono);color:var(--muted);margin-left:8px}
.track{position:relative;height:10px;border-radius:5px;background:var(--chip);margin-top:6px;overflow:hidden}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--accent);transform-origin:left;animation:fillx .6s ease-out both}
.track.none{background:repeating-linear-gradient(90deg,var(--chip) 0 6px,transparent 6px 10px)}
.track .mid{position:absolute;left:50%;top:-2px;bottom:-2px;width:2px;background:var(--surface)}
.cat .ex{font-size:13px;color:var(--muted);margin-top:4px}
.mt{width:100%;font-size:14px}
.mt td,.mt th{padding:9px 6px;white-space:normal;position:static}
.mt td:first-child{font-family:var(--sans);text-align:left}
.mt td .ex{display:block;font-size:12px;color:var(--muted);font-family:var(--sans)}
.mt .cmp{font:500 12px var(--sans);color:var(--muted);white-space:nowrap}
.mt .cmp svg{width:10px;height:10px;vertical-align:-1px}

/* charts */
.chartcard{padding:20px 20px 14px}
.chart{position:relative;width:100%;min-height:200px}
.chart svg{display:block;overflow:visible;touch-action:pan-y}
.chart text{font-family:var(--mono);font-size:11px;fill:var(--muted)}
.chart .lab{fill:var(--ink);font-weight:600;font-size:12px;paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.chart .gridl{stroke:var(--grid);stroke-width:1}
.chart .zero{stroke:var(--axis);stroke-width:1}
.chart .xh{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.chart .bar{transform-box:fill-box;transform-origin:bottom;animation:growy .5s ease-out both}
.chart .bar.neg{transform-origin:top}
.chart .barg:focus{outline:none}
.chart .barg:focus-visible rect,.chart .barg:focus-visible path{stroke:var(--ink);stroke-width:2}
.chart svg:focus{outline:none}
.chart svg:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:6px}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;margin-bottom:12px}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend .ln{width:18px;height:0;border-top:2.5px solid}
.legend .ln.dash{border-top-style:dashed}
.legend .sq{width:11px;height:11px;border-radius:3px}
.legend .ring{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink)}
.legend .ring.sel{border-color:var(--accent)}
.charthead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:10px 16px;margin-bottom:14px}
.charthead h2{margin-bottom:2px}
#tip{position:fixed;z-index:110;pointer-events:none;background:var(--surface);border:1px solid var(--hairline);box-shadow:var(--shadow-hover);border-radius:10px;padding:9px 11px;font-size:12px;min-width:140px;display:none}
#tip.on{display:block}
#tip .th{color:var(--muted);margin-bottom:4px;font-family:var(--sans)}
#tip .tr{display:grid;grid-template-columns:16px auto 1fr;gap:8px;align-items:center;line-height:1.7}
#tip .tr i{width:14px;height:0;border-top:2.5px solid}
#tip .tr b{font:600 13px var(--mono);font-variant-numeric:tabular-nums}
#tip .tr span{color:var(--muted)}
.finals{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.final{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px}
.final .l{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.final .l i{width:16px;height:0;border-top:2.5px solid}
.final .v{font:600 26px/1.2 var(--mono);margin-top:6px;letter-spacing:-.02em}
.final .s{font-size:12px;color:var(--muted)}

/* factor tests */
.fcard h3{font-size:16px}
.verdict{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;margin-top:10px}
.verdict svg{width:20px;height:20px;flex:none}
.verdict.yes{color:var(--accent-ink)}
.verdict.weak{color:var(--ink)}
.verdict.no{color:var(--muted)}
.fcard .dir{font-size:14px;margin-top:6px}
.meter{margin-top:16px}
.meter .mh{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.meter .mh b{font:600 12px var(--mono);color:var(--ink)}
.meter .mt2{position:relative;height:8px;border-radius:4px;background:var(--chip);margin-top:6px}
.meter .mt2 i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--ink);transform-origin:left;animation:fillx .6s ease-out both}
.meter .mt2 u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--muted)}
.meter .ml{position:relative;height:16px;font-size:11px;color:var(--muted);margin-top:4px}
.meter .ml span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.fcard .qq{display:flex;gap:16px;margin-top:14px;padding-top:12px;border-top:1px solid var(--hairline);font-size:13px;color:var(--muted)}
.fcard .qq b{display:block;font:600 16px var(--mono);color:var(--ink)}

/* factor space */
.space{position:relative;height:580px;border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow);overflow:hidden;touch-action:none}
.space canvas{display:block;width:100%;height:100%;cursor:grab;outline:none}
.space canvas:active{cursor:grabbing}
.space canvas:focus-visible{box-shadow:inset 0 0 0 2px var(--accent)}
.space .ov{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.space .ax{position:absolute;left:0;top:0;font:600 12px var(--sans);color:var(--muted);white-space:nowrap}
.space .ax.pos{color:var(--ink)}
.space .ax.corner{font:500 11px var(--sans);color:var(--accent-ink);background:var(--accent-soft);padding:2px 8px;border-radius:999px}
.space .rg{position:absolute;left:0;top:0;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;border:2px solid var(--ink)}
.space .rg.sel{width:28px;height:28px;margin:-14px 0 0 -14px;border-color:var(--accent);border-width:2.5px}
.space .rg span{position:absolute;left:100%;top:50%;transform:translate(6px,-50%);font:600 12px var(--mono);color:var(--ink);background:var(--surface);padding:1px 5px;border-radius:5px;white-space:nowrap}
.space .msg{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:14px;text-align:center;padding:24px}
.space .tools{position:absolute;right:10px;top:10px;display:flex;gap:6px}
.space .tools .iconbtn{background:var(--surface);box-shadow:var(--shadow);width:44px;height:44px}
.space .hint{position:absolute;left:14px;top:12px;font-size:12px;color:var(--muted);pointer-events:none;max-width:60%}
.space .info{position:absolute;left:12px;bottom:12px;width:300px;max-width:calc(100% - 24px);background:var(--surface);border:1px solid var(--hairline);border-radius:12px;box-shadow:var(--shadow-hover);padding:14px 16px;display:none}
.space .info.on{display:block;animation:pop .2s ease-out}
.space .info .ih{display:flex;align-items:baseline;gap:8px;padding-right:32px}
.space .info .ih b{font:600 18px var(--mono)}
.space .info .ih span{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.space .info .x{position:absolute;right:6px;top:6px}
.space .info .zs{font:400 12px var(--mono);color:var(--muted);margin:8px 0 12px}
.space .info .pc{font-size:14px;margin-top:6px}
.space.flat{height:auto;touch-action:auto;padding:16px}

/* footer */
footer{border-top:1px solid var(--hairline);padding:24px 0 32px;color:var(--muted);font-size:13px}
footer .wrap{display:flex;flex-wrap:wrap;gap:6px 20px;justify-content:space-between}

/* ---------------- chart helpers ---------------- */
function nice(lo, hi, count) {
  if (lo === hi) { lo -= 1; hi += 1; }
  const raw = (hi - lo) / count, mag = 10 ** Math.floor(Math.log10(raw)), e = raw / mag;
  const step = mag * (e >= 7.5 ? 10 : e >= 3.5 ? 5 : e >= 1.5 ? 2 : 1);
  const a = Math.floor(lo / step + 1e-9) * step, b = Math.ceil(hi / step - 1e-9) * step, ticks = [];
  for (let v = a; v <= b + step / 2; v += step) ticks.push(+v.toFixed(10));
  return {lo: a, hi: b, ticks};
}
function logTicks(lo, hi) {

  return out;
}
function pathOf(vals, X, Y) {
  let d = "", pen = false;
  vals.forEach((v, i) => { if (v == null) { pen = false; return; } d += (pen ? "L" : "M") + X(i).toFixed(1) + " " + Y(v).toFixed(1); pen = true; });

}
function drawIn(svg, key, width) {

  if (RM || !once("draw:" + key)) { r.setAttribute("width", width); return; }
  const t0 = performance.now(), dur = 900;
  const step = t => { const p = Math.max(0, Math.min(1, (t - t0) / dur)), e = 1 - (1 - p) ** 3; r.setAttribute("width", (width * e).toFixed(1)); if (p < 1) requestAnimationFrame(step); };

}

  const every = Math.max(1, Math.ceil(years.length / Math.max(2, Math.floor(iw / 62))));
  const idx = [];
  dates.forEach((d, i) => { if (d.m === 1 && d.y % every === 0) idx.push(i); });

}

/* line chart with crosshair, end labels and draw-in */
function lineChart(el, o) {

  const H = o.height ?? Math.round(Math.min(400, Math.max(250, W * 0.48)));
  const m = {l: phone ? 46 : 58, r: o.endLabels ? (phone ? 74 : 150) : 14, t: 14, b: 30};
  const iw = W - m.l - m.r, ih = H - m.t - m.b, n = o.dates.length;
  let lo = Infinity, hi = -Infinity;
  o.series.forEach(s => s.v.forEach(v => { if (v != null) { lo = Math.min(lo, v); hi = Math.max(hi, v); } }));
  if (o.zero) { lo = Math.min(lo, 0); hi = Math.max(hi, 0); }
  let Y, yt;
  if (o.log) {
    const a = Math.log10(lo * 0.95), b = Math.log10(hi * 1.05);
    Y = v => m.t + ih - (Math.log10(v) - a) / (b - a) * ih; yt = logTicks(lo * 0.95, hi * 1.05);
  } else {
    const nn = nice(lo, hi, phone ? 4 : 5); lo = nn.lo; hi = nn.hi; yt = nn.ticks;
    Y = v => m.t + ih - (v - lo) / (hi - lo) * ih;
  }
  const X = i => m.l + (n === 1 ? 0 : i / (n - 1) * iw);
  const id = "c" + (++uid);

  yt.forEach(v => { const y = Y(v).toFixed(1); s += `<line class="gridl" x1="${m.l}" x2="${m.l + iw}" y1="${y}" y2="${y}"/><text x="${m.l - 8}" y="${y}" dy="4" text-anchor="end">${o.yFmt(v)}</text>`; });
  if (o.zero && !o.log) s += `<line class="zero" x1="${m.l}" x2="${m.l + iw}" y1="${Y(0)}" y2="${Y(0)}"/>`;
  xTicks(o.dates, iw).forEach(i => { s += `<text x="${X(i)}" y="${H - 8}" text-anchor="middle">${phone ? "’" + String(o.dates[i].y).slice(2) : o.dates[i].y}</text>`; });

    L.forEach(l => { const x = m.l + iw + 6; s += `<line x1="${x}" x2="${x + 10}" y1="${l.y}" y2="${l.y}" style="stroke:${l.sr.color}" stroke-width="2.5"${l.sr.dash ? ' stroke-dasharray="3 2"' : ""}/><text class="lab" x="${x + 14}" y="${l.y}" dy="4">${phone ? esc(l.sr.short) : o.yFmtEnd(l.v)}<tspan class="nm" dx="5" style="fill:var(--muted)" font-weight="400">${phone ? "" : esc(l.sr.end)}</tspan></text>`; });
  }
  s += `</g><g class="hover" style="display:none"><line class="xh" y1="${m.t}" y2="${m.t + ih}"/>${o.series.map(sr => `<circle r="4.5" style="fill:${sr.color};stroke:var(--surface)" stroke-width="2"/>`).join("")}</g>`;
  s += `<rect x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent" class="hit"/></svg>`;
  el.innerHTML = s;
  const svg = el.querySelector("svg"), hg = svg.querySelector(".hover"), xl = hg.querySelector("line"), dots = $$("circle", hg);
  let idx = -1;
  const show = (i, cx, cy) => {
    idx = Math.max(0, Math.min(n - 1, i)); hg.style.display = "";
    const x = X(idx); xl.setAttribute("x1", x); xl.setAttribute("x2", x);
    o.series.forEach((sr, k) => { const v = sr.v[idx]; dots[k].style.display = v == null ? "none" : ""; if (v != null) { dots[k].setAttribute("cx", x); dots[k].setAttribute("cy", Y(v)); } });
    const rows = o.series.map(sr => ({sr, v: sr.v[idx]})).filter(r => r.v != null).sort((a, b) => b.v - a.v);
    const html = `<div class="th">${mlab(o.dates[idx])}</div>` + rows.map(r => `<div class="tr"><i style="border-color:${r.sr.color};${r.sr.dash ? "border-top-style:dashed" : ""}"></i><b>${o.yFmtTip(r.v)}</b><span>${esc(r.sr.end)}</span></div>`).join("");
    const b = svg.getBoundingClientRect();
    showTip(html, cx ?? b.left + x, cy ?? b.top + m.t + 20);
  };
  const hide = () => { hg.style.display = "none"; hideTip(); };
  svg.addEventListener("pointermove", e => { const b = svg.getBoundingClientRect(); show(Math.round((e.clientX - b.left - m.l) / iw * (n - 1)), e.clientX, e.clientY); });
  svg.addEventListener("pointerleave", hide);
  svg.addEventListener("blur", hide);
  svg.addEventListener("keydown", e => {
    if (e.key === "ArrowRight" || e.key === "ArrowLeft") { e.preventDefault(); show((idx < 0 ? n - 1 : idx) + (e.key === "ArrowRight" ? 1 : -1)); }
    else if (e.key === "Home") show(0); else if (e.key === "End") show(n - 1);
  });
  svg.addEventListener("focus", () => show(idx < 0 ? n - 1 : idx));
  drawIn(svg, o.key, W + 40);
}

/* vertical bar chart with reference lines */
function barChart(el, o) {
  const W = Math.max(260, el.clientWidth), phone = W < 520, H = o.height ?? (phone ? 260 : 300);
  const m = {l: phone ? 44 : 54, r: 12, t: 24, b: o.sub ? 44 : 28};
  const iw = W - m.l - m.r, ih = H - m.t - m.b, n = o.bars.length;
  const vals = o.bars.map(b => b.v).concat((o.refs || []).map(r => r.v));
  const nn = nice(Math.min(0, ...vals), Math.max(0, ...vals), 4);
  const Y = v => m.t + ih - (v - nn.lo) / (nn.hi - nn.lo) * ih;
  const band = iw / n, bw = Math.min(64, band * 0.58);
  let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria)}">`;
  nn.ticks.forEach(v => { const y = Y(v); s += `<line class="${v === 0 ? "zero" : "gridl"}" x1="${m.l}" x2="${m.l + iw}" y1="${y}" y2="${y}"/><text x="${m.l - 8}" y="${y}" dy="4" text-anchor="end">${o.yFmt(v)}</text>`; });
  o.bars.forEach((b, i) => {
    const cx = m.l + band * (i + 0.5), x = cx - bw / 2, y0 = Y(0), y1 = Y(b.v), top = Math.min(y0, y1), h = Math.max(1, Math.abs(y1 - y0)), r = Math.min(4, h / 2), neg = b.v < 0;
    const d = neg ? `M${x} ${top}H${x + bw}V${top + h - r}Q${x + bw} ${top + h} ${x + bw - r} ${top + h}H${x + r}Q${x} ${top + h} ${x} ${top + h - r}Z`
                  : `M${x} ${top + h}V${top + r}Q${x} ${top} ${x + r} ${top}H${x + bw - r}Q${x + bw} ${top} ${x + bw} ${top + r}V${top + h}Z`;
    s += `<g class="barg" tabindex="0" role="img" aria-label="${esc(b.label + (b.sub ? " " + b.sub : "") + ": " + o.fmt(b.v))}" data-i="${i}"><rect x="${cx - band / 2}" y="${m.t}" width="${band}" height="${ih}" fill="transparent"/><path class="bar${neg ? " neg" : ""}" d="${d}" style="fill:${b.color};animation-delay:${RM ? 0 : i * 70}ms"/></g>`;
    s += `<text class="lab" x="${cx}" y="${neg ? top + h + 15 : top - 7}" text-anchor="middle">${o.fmt(b.v)}</text>`;
    s += `<text x="${cx}" y="${H - (o.sub ? 26 : 8)}" text-anchor="middle" style="fill:var(--ink);font-weight:600">${esc(b.label)}</text>`;
    if (o.sub) s += `<text x="${cx}" y="${H - 9}" text-anchor="middle">${esc(phone ? (b.subS ?? b.sub) : b.sub)}</text>`;
  });
  const refs = (o.refs || []).filter(r => r.v != null).map(r => ({...r, y: Y(r.v)})).sort((a, b) => a.y - b.y);
  refs.forEach(r => {
    s += `<line x1="${m.l}" x2="${m.l + iw}" y1="${r.y}" y2="${r.y}" style="stroke:${r.color}" stroke-width="1.5" stroke-dasharray="5 4"/>`;
  });
  s += `</svg>`;
  el.innerHTML = (refs.length ? `<div class="legend">${refs.map(r => `<span><i class="ln dash" style="border-color:${r.color}"></i>${esc(r.label)} <b class="mono">${o.fmt(r.v)}</b></span>`).join("")}</div>` : "") + s;
  $$(".barg", el).forEach(g => {
    const b = o.bars[+g.dataset.i];
    const html = `<div class="th">${esc(b.label)}${b.sub ? " · " + esc(b.sub) : ""}</div><div class="tr"><i style="border-color:${b.color}"></i><b>${o.fmt(b.v)}</b><span>${esc(o.tipLabel || "")}</span></div>`;
    g.addEventListener("pointermove", e => showTip(html, e.clientX, e.clientY));
    g.addEventListener("pointerleave", hideTip);
    g.addEventListener("focus", () => { const rr = g.getBoundingClientRect(); showTip(html, rr.left + rr.width / 2, rr.top + 30); });
    g.addEventListener("blur", hideTip);
  });
}

/* monthly IC bars + rolling mean line */
function icChart(el, u) {
  const ic = u.M.IC || [], n = ic.length, dates = u.hold;
  const roll = ic.map((_, i) => { if (i < 11) return null; let s = 0, c = 0; for (let j = i - 11; j <= i; j++) if (ic[j] != null) { s += ic[j]; c++; } return c ? s / c : null; });
  const W = Math.max(260, el.clientWidth), phone = W < 520, H = phone ? 250 : 300;
  const m = {l: phone ? 44 : 54, r: 12, t: 12, b: 30}, iw = W - m.l - m.r, ih = H - m.t - m.b;
  const ext = Math.max(...ic.map(v => Math.abs(v ?? 0)));
  const nn = nice(-ext, ext, 4), Y = v => m.t + ih - (v - nn.lo) / (nn.hi - nn.lo) * ih;
  const band = iw / n, bw = Math.max(1, band - (band > 4 ? 1.5 : 0.6)), X = i => m.l + band * (i + 0.5);
  let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" tabindex="0" aria-label="Monthly rank IC of the composite score, ${n} months, with a 12-month rolling average. Use left and right arrow keys to read values.">`;
  nn.ticks.forEach(v => { const y = Y(v); s += `<line class="${Math.abs(v) < 1e-9 ? "zero" : "gridl"}" x1="${m.l}" x2="${m.l + iw}" y1="${y}" y2="${y}"/><text x="${m.l - 8}" y="${y}" dy="4" text-anchor="end">${F.n2(v)}</text>`; });
  xTicks(dates, iw).forEach(i => { s += `<text x="${X(i)}" y="${H - 8}" text-anchor="middle">${phone ? "’" + String(dates[i].y).slice(2) : dates[i].y}</text>`; });
  s += `<g>`;
  ic.forEach((v, i) => { if (v == null) return; const y0 = Y(0), y1 = Y(v); s += `<rect class="bar${v < 0 ? " neg" : ""}" x="${(X(i) - bw / 2).toFixed(2)}" y="${Math.min(y0, y1).toFixed(1)}" width="${bw.toFixed(2)}" height="${Math.max(0.5, Math.abs(y1 - y0)).toFixed(1)}" opacity=".75" style="fill:${v >= 0 ? "var(--q1)" : "var(--q5)"};animation-delay:${RM ? 0 : Math.round(i * 3)}ms"/>`; });
  s += `</g><path d="${pathOf(roll, X, Y)}" fill="none" style="stroke:var(--ink)" stroke-width="2" stroke-linejoin="round"/>`;
  s += `<g class="hover" style="display:none"><line class="xh" y1="${m.t}" y2="${m.t + ih}"/></g><rect x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent"/></svg>`;
  el.innerHTML = s;
  const svg = el.firstChild, hg = svg.querySelector(".hover"), xl = hg.firstChild;
  let idx = -1;
  const show = (i, cx, cy) => {
    idx = Math.max(0, Math.min(n - 1, i)); hg.style.display = ""; xl.setAttribute("x1", X(idx)); xl.setAttribute("x2", X(idx));
    const html = `<div class="th">${mlab(dates[idx])}</div><div class="tr"><i style="border-color:${(ic[idx] ?? 0) >= 0 ? "var(--q1)" : "var(--q5)"}"></i><b>${F.n3(ic[idx])}</b><span>Monthly IC</span></div><div class="tr"><i style="border-color:var(--ink)"></i><b>${F.n3(roll[idx])}</b><span>12-month avg</span></div>`;
    const b = svg.getBoundingClientRect(); showTip(html, cx ?? b.left + X(idx), cy ?? b.top + 30);
  };
  svg.addEventListener("pointermove", e => { const b = svg.getBoundingClientRect(); show(Math.floor((e.clientX - b.left - m.l) / band), e.clientX, e.clientY); });
  svg.addEventListener("pointerleave", () => { hg.style.display = "none"; hideTip(); });
  svg.addEventListener("blur", () => { hg.style.display = "none"; hideTip(); });
  svg.addEventListener("focus", () => show(idx < 0 ? n - 1 : idx));
  svg.addEventListener("keydown", e => { if (e.key === "ArrowRight" || e.key === "ArrowLeft") { e.preventDefault(); show((idx < 0 ? n - 1 : idx) + (e.key === "ArrowRight" ? 1 : -1)); } });
}

/* ---------------- 1. overview ---------------- */
function headline(u) {
  const c = u.T.composite || {};
  return {ic: c.IC_mean, t: c.IC_t, p: c.IC_p, months: c.Months, reliable: c.IC_p != null && c.IC_p < 0.05};
}
R.overview = () => {
  const u = cur(), h = headline(u), S = u.S, q = k => S[k + "_net"]?.CAGR, spy = S.SPY?.CAGR;
  const span = u.rm.length ? `${mlab(u.rm[0])} – ${mlab(u.rm[u.rm.length - 1])}` : "";
  if (!basic()) return overviewAdv(u, h, span);
  const pos = Math.max(2, Math.min(98, ((h.ic ?? 0) + 0.1) / 0.2 * 100));
  const qs = [1, 2, 3, 4, 5].map(i => q("Q" + i));
  const stair = qs.every((v, i) => i === 0 || v < qs[i - 1]);
  const qmax = Math.max(...qs.map(Math.abs));
  const beta = u.T.beta || {};
  const pctChance = Math.round((h.p ?? 0) * 100);
  return `<div class="stack">
  <section class="hero">
    <p class="eyebrow">The big question</p>
    <h1>Did the model predict returns?</h1>
    <p class="answer">${ico(h.reliable ? "yes" : "slash")}${h.reliable ? "Yes, reliably." : "Not reliably."}</p>
    <p class="lede">The average ${T("ic")} was <b class="mono">${F.n3(h.ic)}</b>, where 0 means no link between scores and next month's returns. A ${T("pvalue")} of <b class="mono">${F.n2(h.p)}</b> means pure chance would produce a result this strong ${pctChance}% of the time.</p>
    <div class="icscale" role="img" aria-label="Rank IC of ${F.n3(h.ic)} on a scale from minus 0.10 to plus 0.10; the no-link zone is between minus 0.02 and plus 0.02.">
      <div class="trk"><span></span><span></span><span></span><div class="mkl" style="left:${pos}%">IC ${F.n3(h.ic)}</div><div class="mk" style="left:${pos}%"></div></div>
      <div class="zl"><span>← Scores pointed the wrong way</span><span>No link</span><span>Scores worked →</span></div>
    </div>
  </section>
  <div class="kpis">
    <div class="kpi"><div class="l">Average rank IC</div><div class="v">${countEl(h.ic, "n3", "ic")}</div><div class="s">0 = no link</div></div>
    <div class="kpi"><div class="l">p-value</div><div class="v">${countEl(h.p, "n2", "p")}</div><div class="s">needs to be below 0.05</div></div>
    <div class="kpi"><div class="l">Months tested</div><div class="v">${countEl(h.months, "int", "m")}</div><div class="s">${span}</div></div>
    <div class="kpi"><div class="l">Stocks ranked</div><div class="v">${countEl(u.n, "int", "n")}</div><div class="s">${UNI_NAME[u.key]}, today</div></div>
  </div>
  <section class="section">
    <h2>Three takeaways</h2>
    <p class="sub">What ${h.months} months of monthly ${T("rebalance", "rebalancing")} tell us, after trading costs.</p>
    <div class="grid3">
      <article class="card lift take"><span class="n">Takeaway 1</span>
        <div class="big">${countEl(q("Q1"), "pct1", "t1")}</div><div class="bl">a year for the top 20%, vs ${F.pct1(spy)} for ${T("spy")}</div>
        <h3>Top-ranked stocks beat SPY, but so did the average stock</h3>
        <p>Simply holding every stock in the list ${T("ew", "equally")} earned ${F.pct1(q("EW"))} a year. Most of the edge over SPY came from the stock list itself, not from the scores.</p></article>
      <article class="card lift take"><span class="n">Takeaway 2</span>
        <div class="minibars" role="img" aria-label="Yearly return by quintile: ${qs.map((v, i) => "Q" + (i + 1) + " " + F.pct1(v)).join(", ")}">${qs.map((v, i) => `<div><i style="height:${Math.max(4, Math.abs(v) / qmax * 40)}px;background:var(--q${i + 1});animation-delay:${i * 70}ms"></i><b>Q${i + 1}</b></div>`).join("")}</div>
        <h3>${stair ? "Returns step down from Q1 to Q5" : "No staircase from best to worst"}</h3>
        <p>If the scores worked, yearly returns would fall step by step from the top ${T("quintile")} (Q1) to the bottom (Q5). ${stair ? "Here they do." : `Instead the bottom 20% earned ${F.pct1(q("Q5"))} a year, close to the top's ${F.pct1(q("Q1"))}, and the middle groups did worst.`}</p></article>
      <article class="card lift take"><span class="n">Takeaway 3</span>
        <div class="big">${countEl(beta.Q5_CAGR, "pct1", "t3")}</div><div class="bl">a year for the highest-${T("beta")} stocks, vs ${F.pct1(beta.Q1_CAGR)} for the lowest</div>
        <h3>${(beta.IC_mean ?? 0) < 0 ? "Riskier stocks did better, not worse" : "Calmer stocks did better"}</h3>
        <p>${(beta.IC_mean ?? 0) < 0 ? "Textbooks say calm, low-beta stocks deliver better risk-adjusted returns. Here the opposite happened" : "Low-beta stocks came out ahead, as the textbook low-volatility effect suggests"}, but the evidence is not strong enough to call reliable (p = ${F.n2(beta.IC_p)}).</p></article>
    </div>
  </section>
  <section class="section teachgrid">
    ${teach("Survivorship bias", `This test uses <b>today's</b> ${UNI_NAME[u.key]} members all the way back to ${u.rm[0]?.y ?? ""}. Companies that shrank, failed or were removed are missing, so every portfolio looks better than it would have in real time. That's why the fair comparison is the equal-weight basket of the same stocks, not SPY.`)}
    ${teach("Look-ahead bias", `Yahoo's company fundamentals are today's numbers, so using them for 2015 would be peeking at the future. The backtest therefore uses only price-based ${T("factor", "factors")} (momentum and low volatility), computed with data available on each date.`)}
    ${teach("What is a factor?", `A factor is a measurable trait, like how cheap a stock is or how much it has risen lately. This lab scores every stock on five of them, then checks whether high scorers went on to earn higher returns.`)}
  </section>
  </div>`;
};
const PNAME = {Q1: "Q1 · Top 20%", Q2: "Q2", Q3: "Q3", Q4: "Q4", Q5: "Q5 · Bottom 20%", LS: "Long–short Q1−Q5", EW: "Equal-weight", SPY: "SPY"};
const SUMCOLS = [
  ["CAGR", "CAGR", "pct1", "cagr"], ["AnnVol", "Ann. vol", "pct1", "volatility"], ["Sharpe", "Sharpe", "n2", "sharpe"], ["Sortino", "Sortino", "n2", "sortino"],
  ["MaxDD", "Max DD", "pct1", "maxdd"], ["Calmar", "Calmar", "n2", "calmar"], ["WinRate", "Win rate", "pct0"], ["BestMonth", "Best mo.", "pct1"],
  ["WorstMonth", "Worst mo.", "pct1"], ["Beta", "Beta", "n2", "beta"], ["Alpha", "Alpha", "pct1", "alpha"], ["TrackingError", "Track. err.", "pct1", "te"],
  ["InfoRatio", "Info ratio", "n2", "ir"], ["AvgTurnover", "Turnover", "pct0", "turnover"],
];
function overviewAdv(u, h, span) {
  const ls = u.S.LS_net || {};
  const order = ["Q1", "Q2", "Q3", "Q4", "Q5", "LS", "EW"];
  const rows = [];
  order.forEach(k => ["net", "gross"].forEach(t => { const r = u.S[k + "_" + t]; if (r) rows.push({k, t, r}); }));
  if (u.S.SPY) rows.push({k: "SPY", t: "", r: u.S.SPY});
  return `<div class="head"><p class="eyebrow">Results summary · ${UNI_NAME[u.key]}</p><h1>Do price factors predict next-month returns?</h1>
  <p class="lede">Monthly ${T("rebalance")}, ${h.months} months (${span}), equal-weighted quintiles, 10 bps per side. Backtest composite = momentum (25%) + low vol (10%), re-normalized; fundamentals are excluded because they are not point-in-time.</p></div>
  <div class="kpis">
    <div class="kpi"><div class="l">Mean ${T("ic", "rank IC")}</div><div class="v">${countEl(h.ic, "n3", "aic")}</div></div>
    <div class="kpi"><div class="l">${T("tstat", "t-stat")}</div><div class="v">${countEl(h.t, "n2", "at")}</div></div>
    <div class="kpi"><div class="l">${T("pvalue")}</div><div class="v">${countEl(h.p, "n3", "ap")}</div></div>
    <div class="kpi"><div class="l">${T("longshort", "L/S CAGR")} (net)</div><div class="v">${countEl(ls.CAGR, "pct1", "als")}</div></div>
    <div class="kpi"><div class="l">Q1 ${T("sharpe")} (net)</div><div class="v">${countEl(u.S.Q1_net?.Sharpe, "n2", "ash")}</div></div>
  </div>
  <section class="section"><h2>Backtest summary</h2><p class="sub">All portfolios, ${T("net")} and ${T("gross")} of costs. Rf = 0 for Sharpe and Sortino; beta and alpha vs SPY.</p>
  <div class="tablebox"><table aria-label="Backtest summary statistics">
    <thead><tr><th class="l stk" scope="col">Portfolio</th><th class="l" scope="col">Costs</th>${SUMCOLS.map(c => `<th scope="col">${c[3] ? T(c[3], c[1]) : c[1]}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(({k, t, r}) => `<tr class="${t}"><td class="l stk" style="font-family:var(--sans);font-weight:${t === "gross" ? 400 : 600}">${PNAME[k]}</td><td class="l">${t ? `<span class="tag">${t}</span>` : ""}</td>${SUMCOLS.map(c => `<td>${F[c[2]](r[c[0]])}</td>`).join("")}</tr>`).join("")}</tbody>
  </table></div></section>
  <section class="section"><h2>Caveats</h2>
  <p class="sub" style="margin-top:8px">• Fundamentals from yfinance are not point-in-time, so value, quality and growth appear only in today's ranking, never in the backtest (avoids ${T("lookahead")}).<br>• The universe is today's constituents, so ${T("survivorship")} inflates every long-only line; compare against equal-weight, not SPY.<br>• Metrics are ${T("winsor", "winsorized")} at 1%/99% before cross-sectional ${T("zscore", "z-scoring")}.</p></section>`;
}

/* ---------------- 2. rankings ---------------- */
function rrow(r) {
  return `<button type="button" class="rrow" data-open="${esc(r.Ticker)}" aria-label="${esc(r.Ticker)}, ${esc(r.Company)}, rank ${r.Rank}, ${F.ord(r.Percentile)} percentile. Open in Stock Lookup">

    <span class="meta"><span class="chip"><i style="background:var(--q${r.Quintile})"></i>${QL[r.Quintile] || "—"}</span>${secChip(r.Sector)}${r.Watch ? '<span class="chip wl">Watchlist</span>' : ""}</span>
    <span class="sc"><span class="mbar"><i style="width:${r.Percentile ?? 0}%;background:var(--q${r.Quintile})"></i></span><span class="pv">${Math.round(r.Percentile ?? 0)}</span></span>
  </button>`;
}
R.rankings = () => {
  const u = cur(), ranked = u.rows.filter(r => r.Composite != null && r.InUni);
  if (basic()) {
    const top = ranked.slice(0, 10), bot = ranked.slice(-10);
    return `<div class="head"><p class="eyebrow">Rankings · ${UNI_NAME[u.key]}</p><h1>Who scores best today?</h1>
    <p class="lede">Each stock gets a ${T("composite")} built from five ${T("factor", "factors")}. Here are the 10 highest and 10 lowest of ${u.n} stocks. Tap one to look closer.</p></div>
    <div class="grid2">
      <section class="card list" aria-label="Top 10"><h2>Top 10</h2><div class="listhead"><span>Rank · stock</span><span>Percentile</span></div>${top.map(rrow).join("")}</section>
      <section class="card list" aria-label="Bottom 10"><h2>Bottom 10</h2><div class="listhead"><span>Rank · stock</span><span>Percentile</span></div>${bot.map(rrow).join("")}</section>
    </div>
    <div class="section teachgrid">
      ${teach("Quintile", `Stocks are sorted by score and cut into five equal groups. Q1 (“Top 20%”) holds the best-scoring fifth, Q5 (“Bottom 20%”) the worst. The backtest compares how these groups performed.`)}
      ${teach("Z-score", `To blend very different numbers (a P/E, a return, a margin), each one is turned into a z-score: how many standard deviations a stock sits above or below the average stock. +1 is clearly better than average; −1 clearly worse.`)}
    </div>`;
