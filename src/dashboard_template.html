<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Equity Factor Lab</title>
<meta name="description" content="Equity Factor Lab: a multi-factor stock ranking and backtest of the S&P 500, explained for beginners and quants.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F7FA;--surface:#FFFFFF;--ink:#0F1B2D;--muted:#5B6B82;--hairline:#E3E8EF;--accent:#2A78D6;
  --chip:#EBEFF5;--hover:#F0F3F8;--accent-soft:rgba(42,120,214,.09);--accent-ink:#1F64B8;
  --q1:#2A78D6;--q2:#6E9EDB;--q3:#A0A8B4;--q4:#EE9468;--q5:#EB6834;--ew:#1BAF7A;--spy:#7F8A9C;
  --warn:#A35A00;--axis:#B7C1CF;--grid:#E3E8EF;
  --shadow:0 1px 2px rgba(15,27,45,.04),0 6px 20px rgba(15,27,45,.06);
  --shadow-hover:0 2px 4px rgba(15,27,45,.06),0 14px 32px rgba(15,27,45,.10);
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:14px;color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0B1220;--surface:#131C2E;--ink:#EEF2F8;--muted:#9AA8BD;--hairline:#24314A;--accent:#4C93E8;
  --chip:#1C2740;--hover:#1A2438;--accent-soft:rgba(76,147,232,.13);--accent-ink:#7DB2F0;
  --q1:#4C93E8;--q2:#6F9AD0;--q3:#8892A3;--q4:#D98A68;--q5:#E8642F;--ew:#1BAF7A;--spy:#8C99AD;
  --warn:#F0A54A;--axis:#3A4A66;--grid:#22304A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  --shadow-hover:0 2px 4px rgba(0,0,0,.35),0 14px 32px rgba(0,0,0,.35);color-scheme:dark;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:120px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,p{margin:0}
a{color:var(--accent-ink)}
button{font:inherit;color:inherit}
.mono,.num,table{font-family:var(--mono);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1240px;margin:0 auto;padding:0 24px}
.skip{position:absolute;left:-999px;top:8px;background:var(--surface);padding:8px 12px;border-radius:8px;z-index:200}
.skip:focus{left:8px}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:saturate(1.5) blur(14px);backdrop-filter:saturate(1.5) blur(14px);border-bottom:1px solid var(--hairline)}
.bar{display:flex;align-items:center;gap:12px;min-height:64px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px;color:var(--ink);text-decoration:none;letter-spacing:-.01em;white-space:nowrap}
.brand svg{width:28px;height:28px;flex:none}
.tabs{display:flex;gap:2px;margin:0 auto}
.tab{appearance:none;border:0;background:none;color:var(--muted);font:500 14px var(--sans);padding:8px 10px;border-radius:10px;cursor:pointer;display:flex;align-items:center;gap:8px;min-height:40px;white-space:nowrap;transition:color .2s ease-out,background-color .2s ease-out}
.tab:hover{color:var(--ink)}
.tab svg{width:22px;height:22px;display:none}
.tab .sm{display:none}
.tab[aria-selected=true]{color:var(--ink);background:var(--surface);box-shadow:var(--shadow)}
.switches{display:flex;gap:8px}
.seg{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--chip);border-radius:11px;padding:3px}
.seg button{position:relative;z-index:1;border:0;background:none;font:500 13px var(--sans);color:var(--muted);padding:6px 10px;border-radius:8px;min-height:34px;cursor:pointer;white-space:nowrap;transition:color .2s ease-out}
.seg button[aria-pressed=true]{color:var(--ink)}
.seg .thumb{position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/var(--n,2));background:var(--surface);border-radius:8px;box-shadow:0 1px 3px rgba(15,27,45,.12);transition:transform .25s ease-out;transform:translateX(calc(100% * var(--i,0)))}
@media (max-width:1239px){.tabs{order:3;width:100%;margin:0 -10px}.switches{margin-left:auto}}

/* ---------- layout ---------- */
main.wrap{padding-top:36px;padding-bottom:72px;min-height:70vh}
.panel{display:none}
.panel.on{display:block}
.enter{animation:enter .34s ease-out}
@keyframes enter{from{opacity:.2;transform:translateY(8px)}to{opacity:1;transform:none}}
.stack>*+*{margin-top:24px}
.eyebrow{font:600 12px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-size:30px;line-height:1.2;font-weight:600;letter-spacing:-.02em;max-width:24ch}
h2{font-size:18px;line-height:1.35;font-weight:600;letter-spacing:-.01em}
h3{font-size:15px;font-weight:600}
.lede{font-size:17px;color:var(--muted);max-width:62ch;margin-top:10px}
p{max-width:65ch}
.muted{color:var(--muted)}
.small{font-size:13px}
.head{margin-bottom:28px}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:22px}
@media (hover:hover){.lift{transition:transform .2s ease-out,box-shadow .2s ease-out}.lift:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover)}}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.kpi{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px}
.kpi .l{font-size:13px;color:var(--muted)}
.kpi .v{font:600 28px/1.2 var(--mono);letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.section{margin-top:40px}
.section>h2{margin-bottom:6px}
.section>.sub{color:var(--muted);margin-bottom:16px;font-size:14px}
.chip{display:inline-flex;align-items:center;gap:6px;font:500 12px/1.4 var(--sans);padding:3px 10px;border-radius:999px;background:var(--chip);color:var(--ink);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.chip i{width:8px;height:8px;border-radius:50%;flex:none}
.chip.wl{background:var(--accent-soft);color:var(--accent-ink)}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:10px;padding:10px 16px;min-height:44px;font:500 14px var(--sans);cursor:pointer;background:var(--accent);color:#fff;transition:filter .2s ease-out}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--chip);color:var(--ink)}
.iconbtn{border:0;background:none;width:40px;height:40px;border-radius:10px;cursor:pointer;color:var(--muted);display:inline-grid;place-items:center}
.iconbtn:hover{background:var(--hover);color:var(--ink)}
.iconbtn svg{width:18px;height:18px}

/* glossary terms + popover */
button.term{background:none;border:0;padding:0;cursor:help;text-decoration:underline dotted;text-decoration-color:var(--muted);text-decoration-thickness:1.5px;text-underline-offset:3px;font:inherit;color:inherit;text-align:inherit}
button.term:hover{text-decoration-color:var(--accent);color:var(--accent-ink)}
#pop{position:fixed;z-index:120;max-width:min(300px,calc(100vw - 24px));background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.5;box-shadow:var(--shadow-hover);display:none}
#pop b{display:block;font-size:13px;margin-bottom:2px}
#pop.on{display:block;animation:pop .18s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(4px)}}
.dq{border:0;background:none;padding:0 2px;cursor:help;color:var(--warn);display:inline-flex;align-items:center;gap:4px;font:500 12px var(--sans);vertical-align:middle}
.dq svg{width:15px;height:15px}

/* teaching callouts */
.teach{background:var(--accent-soft);border-radius:var(--r);padding:16px 18px;display:grid;align-content:start;grid-template-columns:28px minmax(0,1fr);gap:4px 10px;align-items:start}
.teach svg{width:22px;height:22px;color:var(--accent-ink);margin-top:1px}
.teach .tl{font:600 12px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink)}
.teach p{grid-column:2;font-size:14.5px}
.teachgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}

/* overview */
.hero{padding:8px 0 4px}
.hero h1{font-size:34px;max-width:none}
.answer{display:flex;align-items:center;gap:14px;font-size:52px;line-height:1.1;font-weight:600;letter-spacing:-.03em;margin-top:6px}
.answer svg{width:44px;height:44px;color:var(--muted);flex:none}
.icscale{margin-top:26px;max-width:640px}
.icscale .trk{position:relative;height:10px;border-radius:5px;display:grid;grid-template-columns:2fr 1fr 2fr;gap:3px}
.icscale .trk span{background:var(--chip);border-radius:5px}
.icscale .trk span:nth-child(2){background:var(--hairline)}
.icscale .mk{position:absolute;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:var(--ink);border:3px solid var(--surface);box-shadow:0 0 0 1px var(--ink)}
.icscale .mkl{position:absolute;bottom:18px;transform:translateX(-50%);font:600 13px var(--mono);white-space:nowrap}
.icscale .zl{display:grid;grid-template-columns:2fr 1fr 2fr;font-size:12px;color:var(--muted);margin-top:8px;text-align:center}
.icscale .zl span:first-child{text-align:left}.icscale .zl span:last-child{text-align:right}
.take{display:flex;flex-direction:column;gap:10px}
.take .n{font:600 12px var(--sans);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.take .big{font:600 34px/1.1 var(--mono);letter-spacing:-.02em}
.take .bl{font-size:13px;color:var(--muted);margin-top:-6px}
.take h3{font-size:16px;line-height:1.35;margin-top:4px}
.take p{font-size:14px;color:var(--muted)}
.minibars{display:flex;align-items:flex-end;gap:6px;height:56px;margin-top:2px}
.minibars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.minibars i{display:block;width:100%;max-width:30px;border-radius:4px 4px 1px 1px;transform-origin:bottom;animation:growy .5s ease-out both}
.minibars b{font:500 10px var(--mono);color:var(--muted)}

/* tables */
.tablebox{overflow:auto;border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow);max-width:100%;-webkit-overflow-scrolling:touch}
.tablebox.tall{max-height:70vh}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
th,td{padding:10px 12px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--hairline)}
th{font:600 12px var(--sans);color:var(--muted);background:var(--surface);position:sticky;top:0;z-index:2}
th.l,td.l{text-align:left}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--hover)}
td.stk,th.stk{position:sticky;left:0;z-index:1;background:var(--surface)}
th.stk{z-index:3}
th button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
th button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
th[aria-sort] button::after{content:"";width:0;height:0;border:4px solid transparent;opacity:.0}
th[aria-sort=ascending] button::after{border-bottom-color:currentColor;margin-top:-4px;opacity:1}
th[aria-sort=descending] button::after{border-top-color:currentColor;margin-top:4px;opacity:1}
td .tkb{all:unset;cursor:pointer;font-weight:600;color:var(--ink)}
td .tkb:hover{color:var(--accent-ink);text-decoration:underline}
td .tkb:focus-visible{outline:2px solid var(--accent);border-radius:3px}
td.co{max-width:220px;overflow:hidden;text-overflow:ellipsis;font-family:var(--sans)}
tr.gross td{color:var(--muted)}
.tag{font:500 11px var(--sans);padding:1px 7px;border-radius:999px;background:var(--chip);color:var(--muted)}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.controls input,.controls select{font:400 14px var(--sans);color:var(--ink);background:var(--surface);border:1px solid var(--hairline);border-radius:10px;padding:0 12px;min-height:42px}
.controls input{flex:1 1 220px;min-width:0}
.controls select{flex:1 1 150px;max-width:260px}
.controls .count{font-size:13px;color:var(--muted);margin-left:auto}

/* rankings basic */
.list h2{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.listhead{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--hairline);margin-bottom:4px}
.rrow{display:grid;grid-template-columns:30px minmax(0,1fr) auto;grid-template-areas:"rk who sc" "rk meta sc";align-items:center;gap:3px 12px;padding:10px 8px;border-radius:10px;width:100%;text-align:left;border:0;background:none;cursor:pointer;transition:background-color .2s ease-out}
.rrow:hover{background:var(--hover)}
.rrow .rk{grid-area:rk;font:500 13px var(--mono);color:var(--muted)}
.rrow .who{grid-area:who;display:flex;gap:8px;align-items:baseline;min-width:0}
.rrow .tk{font:600 15px var(--mono)}
.rrow .co{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.rrow .meta{grid-area:meta;display:flex;gap:6px;flex-wrap:wrap;min-width:0}
.rrow .sc{grid-area:sc;display:flex;align-items:center;gap:10px}
.mbar{width:72px;height:6px;border-radius:3px;background:var(--chip);overflow:hidden}
.mbar i{display:block;height:100%;border-radius:3px;transform-origin:left;animation:fillx .6s ease-out both}
.rrow .pv{font:500 13px var(--mono);min-width:30px;text-align:right}
@keyframes fillx{from{transform:scaleX(0)}}
@keyframes growy{from{transform:scaleY(0)}}

/* lookup */
.combo{position:relative;max-width:560px}
.combo input{width:100%;font:400 16px var(--sans);color:var(--ink);background:var(--surface);border:1px solid var(--hairline);border-radius:12px;padding:0 14px 0 44px;min-height:50px;box-shadow:var(--shadow)}
.combo>svg{position:absolute;left:14px;top:15px;width:20px;height:20px;color:var(--muted);pointer-events:none}
.combo ul{position:absolute;z-index:30;left:0;right:0;top:56px;margin:0;padding:6px;list-style:none;background:var(--surface);border-radius:12px;box-shadow:var(--shadow-hover);border:1px solid var(--hairline);max-height:340px;overflow:auto}
.combo li{display:flex;align-items:center;gap:10px;padding:10px;border-radius:8px;cursor:pointer;min-height:44px}
.combo li[aria-selected=true],.combo li:hover{background:var(--hover)}
.combo li b{font:600 14px var(--mono);min-width:56px}
.combo li span{color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.lk{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:20px;margin-top:24px;align-items:start}
.lk .col{display:grid;gap:20px}
.idh{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px}
.idh .tk{font:600 30px/1.1 var(--mono);letter-spacing:-.02em}
.idh .co{color:var(--muted);font-size:15px;flex-basis:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.gauge{display:block;width:100%;max-width:280px;margin:18px auto 0}
.gauge .trackarc{stroke:var(--chip)}
.gcap{text-align:center;font-size:14px;color:var(--muted);margin-top:-2px}
.srank{display:flex;justify-content:center;gap:8px;align-items:baseline;margin-top:14px;font-size:14px}
.srank b{font:600 18px var(--mono)}
.insum{margin-top:18px;padding-top:16px;border-top:1px solid var(--hairline);font-size:14.5px}
.cat+.cat{margin-top:16px}
.cat .ch{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px}
.cat .ch b{font:600 14px var(--mono)}
.cat .ch .z{font:400 12px var(--mono);color:var(--muted);margin-left:8px}
.track{position:relative;height:10px;border-radius:5px;background:var(--chip);margin-top:6px;overflow:hidden}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--accent);transform-origin:left;animation:fillx .6s ease-out both}
.track.none{background:repeating-linear-gradient(90deg,var(--chip) 0 6px,transparent 6px 10px)}
.track .mid{position:absolute;left:50%;top:-2px;bottom:-2px;width:2px;background:var(--surface)}
.cat .ex{font-size:13px;color:var(--muted);margin-top:4px}
.mt{width:100%;font-size:14px}
.mt td,.mt th{padding:9px 6px;white-space:normal;position:static}
.mt td:first-child{font-family:var(--sans);text-align:left}
.mt td .ex{display:block;font-size:12px;color:var(--muted);font-family:var(--sans)}
.mt .cmp{font:500 12px var(--sans);color:var(--muted);white-space:nowrap}
.mt .cmp svg{width:10px;height:10px;vertical-align:-1px}

/* charts */
.chartcard{padding:20px 20px 14px}
.chart{position:relative;width:100%;min-height:200px}
.chart svg{display:block;overflow:visible;touch-action:pan-y}
.chart text{font-family:var(--mono);font-size:11px;fill:var(--muted)}
.chart .lab{fill:var(--ink);font-weight:600;font-size:12px;paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.chart .gridl{stroke:var(--grid);stroke-width:1}
.chart .zero{stroke:var(--axis);stroke-width:1}
.chart .xh{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.chart .bar{transform-box:fill-box;transform-origin:bottom;animation:growy .5s ease-out both}
.chart .bar.neg{transform-origin:top}
.chart .barg:focus{outline:none}
.chart .barg:focus-visible rect,.chart .barg:focus-visible path{stroke:var(--ink);stroke-width:2}
.chart svg:focus{outline:none}
.chart svg:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:6px}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;margin-bottom:12px}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend .ln{width:18px;height:0;border-top:2.5px solid}
.legend .ln.dash{border-top-style:dashed}
.legend .sq{width:11px;height:11px;border-radius:3px}
.legend .ring{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink)}
.legend .ring.sel{border-color:var(--accent)}
.charthead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:10px 16px;margin-bottom:14px}
.charthead h2{margin-bottom:2px}
#tip{position:fixed;z-index:110;pointer-events:none;background:var(--surface);border:1px solid var(--hairline);box-shadow:var(--shadow-hover);border-radius:10px;padding:9px 11px;font-size:12px;min-width:140px;display:none}
#tip.on{display:block}
#tip .th{color:var(--muted);margin-bottom:4px;font-family:var(--sans)}
#tip .tr{display:grid;grid-template-columns:16px auto 1fr;gap:8px;align-items:center;line-height:1.7}
#tip .tr i{width:14px;height:0;border-top:2.5px solid}
#tip .tr b{font:600 13px var(--mono);font-variant-numeric:tabular-nums}
#tip .tr span{color:var(--muted)}
.finals{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.final{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px}
.final .l{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.final .l i{width:16px;height:0;border-top:2.5px solid}
.final .v{font:600 26px/1.2 var(--mono);margin-top:6px;letter-spacing:-.02em}
.final .s{font-size:12px;color:var(--muted)}

/* factor tests */
.fcard h3{font-size:16px}
.verdict{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;margin-top:10px}
.verdict svg{width:20px;height:20px;flex:none}
.verdict.yes{color:var(--accent-ink)}
.verdict.weak{color:var(--ink)}
.verdict.no{color:var(--muted)}
.fcard .dir{font-size:14px;margin-top:6px}
.meter{margin-top:16px}

<script>
"use strict";
const DATA = /*__DATA__*/null;
const THREE_URL = "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js";
const THREE_SRI = "sha512-vnmn/Qqn6aG0POAc9mIGzjq0IybrvxJXYDafNvp9JSnDGxeF3pbkSqLvf+YGd5ku63pT7sa/jxHn7/d0mU8+tA==";
const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = {
  get(k, d) { try { return localStorage.getItem(k) ?? d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

/* ---------------- formatting ---------------- */
const MINUS = "−";
function fx(v, d) { if (v == null || !isFinite(v)) return "—"; const s = Math.abs(v) < 0.5 * 10 ** -d ? (0).toFixed(d) : (v + Math.sign(v) * 1e-9).toFixed(d); return s.replace("-", MINUS); }
const F = {
  pct0: v => v == null ? "—" : fx(v * 100, 0) + "%",
  pct1: v => v == null ? "—" : fx(v * 100, 1) + "%",
  spct1: v => v == null ? "—" : (v > 0 ? "+" : "") + fx(v * 100, 1) + "%",
  n1: v => fx(v, 1), n2: v => fx(v, 2), n3: v => fx(v, 3),
  z: v => v == null ? "—" : (v > 0.005 ? "+" : "") + fx(v, 2),
  int: v => v == null ? "—" : Math.round(v).toLocaleString("en-US"),
  usd: v => v == null ? "—" : "$" + Math.round(v).toLocaleString("en-US"),
  usdk: v => v == null ? "—" : v === 0 ? "$0" : "$" + (v >= 1e5 ? Math.round(v / 1e3) : (v / 1e3).toFixed(1).replace(/\.0$/, "")) + "k",
  px: v => v == null ? "—" : "$" + v.toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2}),
  mcap: v => v == null ? "—" : v >= 1e12 ? "$" + (v / 1e12).toFixed(2) + "T" : v >= 1e9 ? "$" + (v / 1e9).toFixed(1) + "B" : "$" + (v / 1e6).toFixed(0) + "M",
  x1: v => v == null ? "—" : fx(v, 1) + "×",
  ord: v => { if (v == null) return "—"; const n = Math.round(v), t = n % 100, s = (t >= 11 && t <= 13) ? "th" : ({1: "st", 2: "nd", 3: "rd"}[n % 10] || "th"); return n + s; },
};
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const ym = s => { const [y, m] = String(s).split("-").map(Number); return {y, m}; };
const nextM = d => d.m === 12 ? {y: d.y + 1, m: 1} : {y: d.y, m: d.m + 1};
const mlab = d => MON[d.m - 1] + " " + d.y;

/* ---------------- data prep ---------------- */
const objs = rec => rec ? rec.rows.map(r => Object.fromEntries(rec.cols.map((c, i) => [c, r[i]]))) : [];
const colsOf = rec => { const o = {}; if (!rec) return o; rec.cols.forEach((c, i) => o[c] = rec.rows.map(r => r[i])); return o; };
const UNI_NAME = {sp500: "S&P 500", test50: "50-stock set"};
const UNI_THE = {sp500: "the S&P 500", test50: "the 50-stock test set"};
const WATCH = new Set(DATA.watchlist || []);
const U = {};
for (const [k, d] of Object.entries(DATA.universes)) {
  const rows = objs(d.rankings);
  const by = Object.fromEntries(rows.map(r => [r.Ticker, r]));
  const S = Object.fromEntries(objs(d.summary).map(r => [r.Portfolio, r]));
  const tests = objs(d.tests);
  const T = Object.fromEntries(tests.map(r => [r.factor, r]));
  const M = colsOf(d.monthly);
  const med = Object.fromEntries(objs(d.sectorMedian).map(r => [r.Sector, r]));
  const rm = (M.rebalance_month || []).map(ym);
  const hold = rm.map(nextM);
  const n = rows.filter(r => r.InUni).length;
  const sectors = [...new Set(rows.map(r => r.Sector))].sort();
  U[k] = {key: k, rows, by, S, tests, T, M, med, rm, hold, n, sectors, asof: d.asof};
}
const UNIS = Object.keys(U);

/* ---------------- glossary ---------------- */
const GL = {
  factor: ["Factor", "A measurable trait of a stock, such as cheapness or recent price trend, that might help explain why some stocks beat others."],
  zscore: ["Z-score", "How far a value sits from the average, in standard deviations. 0 is average, +1 is clearly above, −1 clearly below."],
  quintile: ["Quintile", "One fifth of the ranked list. Q1 is the top 20% by score, Q5 the bottom 20%."],
  percentile: ["Percentile", "The share of stocks this one beats. The 90th percentile scores higher than 90% of the list."],
  composite: ["Composite score", "The weighted blend of five category scores: value 25%, quality 25%, momentum 25%, growth 15%, low vol 10%."],
  cagr: ["CAGR", "Compound annual growth rate: the steady yearly return that turns the starting amount into the ending amount."],
  sharpe: ["Sharpe ratio", "Return per unit of risk: annual return divided by annual volatility. Higher is better; around 1 is good for stocks."],
  maxdd: ["Max drawdown", "The largest fall from a previous peak to a later low. It shows the worst loss an investor would have sat through."],
  drawdown: ["Drawdown", "How far a portfolio sits below its previous high point."],
  ic: ["Rank IC", "Rank information coefficient: the correlation between this month's scores and next month's returns. 0 means no link; about 0.05 is considered useful."],
  pvalue: ["p-value", "The chance of a result at least this strong if the scores had no real link to returns. Below 0.05 is the usual bar for “reliable”."],
  tstat: ["t-statistic", "The average IC divided by its standard error. As a rule of thumb, |t| above 2 means the signal is unlikely to be luck."],
  survivorship: ["Survivorship bias", "Testing only companies that still exist today. Firms that failed or were dropped are missing, which flatters past returns."],
  lookahead: ["Look-ahead bias", "Using information in a backtest that was not yet available on that date. It makes results look better than reality."],
  ew: ["Equal-weight", "Every stock held in the same dollar amount, regardless of company size."],
  spy: ["SPY", "An ETF that tracks the S&P 500, weighted by company size. The standard benchmark for US large caps."],
  beta: ["Beta", "How much a stock tends to move when the market moves 1%. A beta of 1.5 means about 1.5%."],
  volatility: ["Volatility", "How much the price swings: the annualized standard deviation of daily returns."],
  momentum: ["Momentum", "The tendency of recent winners to keep winning, measured by 12-1 month and 6-month returns."],
  value: ["Value", "How cheap a stock is versus its earnings, free cash flow and EBITDA."],
  quality: ["Quality", "How profitable and financially sound a company is: return on equity, gross margin, low debt."],
  growth: ["Growth", "How fast revenue and earnings are growing."],
  lowvol: ["Low volatility", "A preference for calmer stocks: low 60-day volatility and low beta."],
  longshort: ["Long–short", "Buy the top quintile and short-sell the bottom one. Its return isolates the gap between them."],
  turnover: ["Turnover", "The share of the portfolio traded at each monthly rebalance. More trading means higher costs."],
  net: ["Net returns", "Returns after transaction costs of 10 basis points (0.10%) per dollar traded."],
  gross: ["Gross returns", "Returns before transaction costs."],
  fcfyield: ["FCF yield", "Free cash flow divided by market value. Higher means you pay less for each dollar of cash the business generates."],
  evebitda: ["EV/EBITDA", "Enterprise value (equity plus debt minus cash) divided by operating earnings. Lower means cheaper."],
  winsor: ["Winsorize", "Cap extreme values at the 1st and 99th percentiles so one outlier cannot dominate the average."],
  rebalance: ["Rebalance", "Re-rank the stocks and reset the portfolios to equal weights, here at each month-end."],
  sortino: ["Sortino ratio", "Like the Sharpe ratio, but only counts downside volatility as risk."],
  calmar: ["Calmar ratio", "CAGR divided by the size of the maximum drawdown."],
  alpha: ["Alpha", "Annual return not explained by the portfolio's exposure to the market (its beta)."],
  ir: ["Information ratio", "Average return above SPY divided by tracking error."],
  te: ["Tracking error", "Volatility of the return difference between the portfolio and SPY."],
};
const lc = s => /^[A-Z][a-z]/.test(s) ? s[0].toLowerCase() + s.slice(1) : s;
const T = (k, txt) => `<button type="button" class="term" data-term="${k}">${txt ?? lc(GL[k][0])}</button>`;

/* ---------------- icons ---------------- */
const IC = {
  overview: '<rect x="3.5" y="3.5" width="7" height="8" rx="1.8"/><rect x="13.5" y="3.5" width="7" height="5" rx="1.8"/><rect x="13.5" y="11.5" width="7" height="9" rx="1.8"/><rect x="3.5" y="14.5" width="7" height="6" rx="1.8"/>',
  rankings: '<path d="M4 6.5h16M4 12h11M4 17.5h6"/>',
  lookup: '<circle cx="10.5" cy="10.5" r="6.2"/><path d="M15.2 15.2l5 5"/>',
  space: '<path d="M12 3l8 4.6v8.8L12 21l-8-4.6V7.6z"/><path d="M12 12l8-4.4M12 12v9M12 12L4 7.6"/>',
  backtest: '<path d="M3.5 20.5h17"/><path d="M4.5 16l4.5-4.5 3.5 3 7.5-8"/>',
  tests: '<path d="M9 3.5h6M10 3.5v6L4.8 18.3A1.6 1.6 0 006.2 20.7h11.6a1.6 1.6 0 001.4-2.4L14 9.5v-6"/><path d="M7.3 15h9.4"/>',
  search: '<circle cx="10.5" cy="10.5" r="6.2"/><path d="M15.2 15.2l5 5"/>',
  bulb: '<path d="M9 18h6M10 21h4M12 3a6 6 0 00-3.6 10.8c.6.5 1 1.2 1 2V16h5.2v-.2c0-.8.4-1.5 1-2A6 6 0 0012 3z"/>',
  warn: '<path d="M12 4l9 16H3z"/><path d="M12 10v4.5M12 17.2v.3"/>',
  yes: '<circle cx="12" cy="12" r="9"/><path d="M8 12.3l2.7 2.7L16.2 9.5"/>',
  weak: '<circle cx="12" cy="12" r="9"/><path d="M8 12.5c1.3-1.6 2.7-1.6 4 0s2.7 1.6 4 0"/>',
  no: '<circle cx="12" cy="12" r="9"/><path d="M8 12h8"/>',
  slash: '<circle cx="12" cy="12" r="9"/><path d="M5.6 18.4L18.4 5.6"/>',
  up: '<path d="M6 15l6-6 6 6"/>', down: '<path d="M6 9l6 6 6-6"/>', eq: '<path d="M6 10h12M6 14h12"/>',
  close: '<path d="M6 6l12 12M18 6L6 18"/>',
  reset: '<path d="M4 12a8 8 0 108-8 8 8 0 00-5.7 2.3L4 8.5"/><path d="M4 4v4.5h4.5"/>',
};
const ico = (k, extra = "") => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ${extra}>${IC[k]}</svg>`;

/* ---------------- state ---------------- */
const TABS = [
  {id: "overview", lg: "Overview", sm: "Overview"},
  {id: "rankings", lg: "Rankings", sm: "Rankings"},
  {id: "lookup", lg: "Stock Lookup", sm: "Lookup"},
  {id: "space", lg: "Factor Space", sm: "3D Space"},
  {id: "backtest", lg: "Backtest", sm: "Backtest"},
  {id: "tests", lg: "Factor Tests", sm: "Tests"},
];
const TAB_IDS = TABS.map(t => t.id);
const hashTab = location.hash.slice(1);
const state = {
  tab: TAB_IDS.includes(hashTab) ? hashTab : (TAB_IDS.includes(store.get("efl.tab")) ? store.get("efl.tab") : "overview"),
  mode: store.get("efl.mode") === "advanced" ? "advanced" : "basic",
  uni: UNIS.includes(store.get("efl.uni")) ? store.get("efl.uni") : UNIS[0],
  stock: null,
  rk: {q: "", sector: "", quint: "", sort: "Rank", dir: 1},
  log: false,
};
const cur = () => U[state.uni];
const basic = () => state.mode === "basic";
function defaultStock(u) {
  for (const t of [...WATCH, "AFRM"]) if (u.by[t]) return t;
  return u.by.AAPL ? "AAPL" : u.rows[0].Ticker;
}
const seen = new Set();
const once = key => { const k = state.uni + ":" + key; if (seen.has(k)) return false; seen.add(k); return true; };

/* ---------------- shared bits ---------------- */
const QL = {1: "Top 20%", 2: "Upper middle", 3: "Middle", 4: "Lower middle", 5: "Bottom 20%"};
const qChip = q => q ? `<span class="chip"><i style="background:var(--q${q})"></i>Q${q} · ${QL[q]}</span>` : `<span class="chip">Unranked</span>`;
const secChip = s => `<span class="chip" title="${esc(s)}">${esc(s)}</span>`;
const wlChip = r => r.Watch ? `<span class="chip wl">Watchlist</span>` : "";
const dqBtn = r => r.Flag ? `<button type="button" class="dq" data-dq="${esc(r.Flag)}" aria-label="Check data: ${esc(r.Flag)}">${ico("warn")}<span class="sr">Check data</span></button>` : "";
const teach = (title, html) => basic() ? `<aside class="teach" aria-label="Teaching moment: ${esc(title)}">${ico("bulb")}<div class="tl">Teaching moment · ${title}</div><p>${html}</p></aside>` : "";
const countEl = (v, fmt, key, tag = "span", cls = "") => `<${tag} class="${cls}" data-count="${v}" data-fmt="${fmt}" data-key="${key}">${F[fmt](v)}</${tag}>`;
const CATS = [
  {k: "Value", term: "value", ex: "Is the share price cheap relative to earnings and cash flow?"},
  {k: "Quality", term: "quality", ex: "Is the business profitable, with modest debt?"},
  {k: "Momentum", term: "momentum", ex: "Has the stock been rising over the past 6–12 months?"},
  {k: "Growth", term: "growth", ex: "Are revenue and earnings growing?"},
  {k: "LowVol", label: "Low vol", term: "lowvol", ex: "Is the price calm rather than jumpy?"},
];
const catLabel = c => c.label || c.k;
const SERIES = {
  Q1: {label: "Top 20% (Q1)", short: "Q1", end: "Top 20%", color: "var(--q1)"},
  Q5: {label: "Bottom 20% (Q5)", short: "Q5", end: "Bottom 20%", color: "var(--q5)"},
  EW: {label: "All stocks, equal-weight", short: "EW", end: "All stocks", color: "var(--ew)"},
  SPY: {label: "SPY (S&P 500 ETF)", short: "SPY", end: "SPY", color: "var(--spy)", dash: true},

/* ---------------- chart helpers ---------------- */
function nice(lo, hi, count) {
  if (lo === hi) { lo -= 1; hi += 1; }
  const raw = (hi - lo) / count, mag = 10 ** Math.floor(Math.log10(raw)), e = raw / mag;
  const step = mag * (e >= 7.5 ? 10 : e >= 3.5 ? 5 : e >= 1.5 ? 2 : 1);
  const a = Math.floor(lo / step + 1e-9) * step, b = Math.ceil(hi / step - 1e-9) * step, ticks = [];
  for (let v = a; v <= b + step / 2; v += step) ticks.push(+v.toFixed(10));
  return {lo: a, hi: b, ticks};
}
function logTicks(lo, hi) {
  const out = [];
  for (let p = Math.floor(Math.log10(lo)); p <= Math.ceil(Math.log10(hi)); p++) for (const k of [1, 2, 5]) { const v = k * 10 ** p; if (v >= lo * 0.98 && v <= hi * 1.02) out.push(v); }
  return out;
}
function pathOf(vals, X, Y) {
  let d = "", pen = false;
  vals.forEach((v, i) => { if (v == null) { pen = false; return; } d += (pen ? "L" : "M") + X(i).toFixed(1) + " " + Y(v).toFixed(1); pen = true; });
  return d;
}
function drawIn(svg, key, width) {
  const r = svg.querySelector(".cliprect");
  if (!r) return;
  if (RM || !once("draw:" + key)) { r.setAttribute("width", width); return; }
  const t0 = performance.now(), dur = 900;
  const step = t => { const p = Math.max(0, Math.min(1, (t - t0) / dur)), e = 1 - (1 - p) ** 3; r.setAttribute("width", (width * e).toFixed(1)); if (p < 1) requestAnimationFrame(step); };
  r.setAttribute("width", 0); requestAnimationFrame(step);
}
function xTicks(dates, iw) {
  const years = [...new Set(dates.map(d => d.y))];
  const every = Math.max(1, Math.ceil(years.length / Math.max(2, Math.floor(iw / 62))));
  const idx = [];
  dates.forEach((d, i) => { if (d.m === 1 && d.y % every === 0) idx.push(i); });
  return idx;
}

    ${teach("CAGR", `Compound annual growth rate is the steady yearly return that turns $10,000 into the final amount. ${F.pct1(finals[0].cagr)} a year for ${yrs} years is how the top 20% reached ${F.usd(finals[0].v)}.`)}
    ${teach("Sharpe ratio", `Return per unit of risk: yearly return divided by how much it swings. The top 20% scored ${F.n2(u.S.Q1_net?.Sharpe)} vs ${F.n2(u.S.SPY?.Sharpe)} for SPY. Above 1 is considered good for a stock portfolio.`)}
    ${teach("Max drawdown", `The worst peak-to-low fall along the way. The bottom 20% once fell ${F.pct0(Math.abs(u.S.Q5_net?.MaxDD ?? 0))} from its high; SPY's worst was ${F.pct0(Math.abs(u.S.SPY?.MaxDD ?? 0))}. Bigger drawdowns are harder to sit through.`)}
  </section>` : `<section class="card chartcard section"><div class="charthead"><div><h2>${T("drawdown", "Drawdown")}</h2><p class="muted small">Distance below the previous peak, net</p></div></div>${legend(["Q1", "Q5", "EW", "SPY"])}<div class="chart" id="bt-dd"></div></section>
  <section class="section"><h2>Monthly returns</h2><p class="sub">Net returns for the month after each rebalance, newest first. IC = rank IC of the composite that month.</p>
    <div class="tablebox tall"><table aria-label="Monthly returns"><thead><tr><th class="l stk" scope="col">Month</th>${["Q1", "Q2", "Q3", "Q4", "Q5"].map(q => `<th scope="col">${q}</th>`).join("")}<th scope="col">EW</th><th scope="col">L/S</th><th scope="col">SPY</th><th scope="col">IC</th></tr></thead>
    <tbody>${rows.map(i => `<tr><td class="l stk">${mlab(u.hold[i])}</td>${["Q1", "Q2", "Q3", "Q4", "Q5", "EW", "LS"].map(q => `<td>${F.pct1(M[q + "_net"]?.[i])}</td>`).join("")}<td>${F.pct1(M.SPY?.[i])}</td><td>${F.n3(M.IC?.[i])}</td></tr>`).join("")}</tbody></table></div></section>`}`;
};

/* ---------------- 6. factor tests ---------------- */
const FT = {
  mom_12_1: {b: "Momentum (12 months)", a: "12-1M momentum", ex: "Stocks that rose over the past year, skipping the latest month.", risk: false},
  ret_6m: {b: "Momentum (6 months)", a: "6M momentum", ex: "Stocks that rose over the past six months.", risk: false},
  vol_60d: {b: "Low volatility", a: "60D volatility (inv.)", ex: "Calmer stocks with smaller daily price swings.", risk: true},
  beta: {b: "Low beta", a: "Beta vs SPY (inv.)", ex: "Stocks that move less than the market.", risk: true},
  composite: {b: "Combined model score", a: "Composite (mom + low vol)", ex: "The backtest blend of momentum and low volatility.", risk: false},
};
function verdict(p) { return p < 0.05 ? ["yes", "Reliable signal"] : p < 0.10 ? ["weak", "Weak hint"] : ["no", "No reliable signal"]; }
function direction(t, ft) {
  if (t.IC_mean >= 0) return ft.risk ? "Pointed the textbook way: calmer stocks did a bit better." : "Pointed the right way, but only slightly.";
  return ft.risk ? "Pointed the wrong way: jumpier stocks did better." : "Pointed the wrong way: higher scores did slightly worse.";
}
R.tests = () => {
  const u = cur(), tests = u.tests;
  if (basic()) return `<div class="head"><p class="eyebrow">Factor Tests · ${UNI_NAME[u.key]}</p><h1>Does any single signal work?</h1>
  <p class="lede">Each price-based ${T("factor")} was tested on its own for ${u.T.composite?.Months ?? tests[0]?.Months ?? ""} months. The meter shows signal strength; a reliable signal needs to pass the line.</p></div>
  <div class="grid3">${tests.map(t => { const ft = FT[t.factor] || {b: t.factor, ex: ""}, [cls, txt] = verdict(t.IC_p), at = Math.abs(t.IC_t), w = Math.min(100, at / 3 * 100);
    return `<article class="card lift fcard"><h3>${esc(ft.b)}</h3><p class="muted small" style="margin-top:2px">${esc(ft.ex)}</p>
      <div class="verdict ${cls}">${ico(cls)}${txt}</div><p class="dir">${direction(t, ft)}</p>
      <div class="meter"><div class="mh"><span>Signal strength</span><b>${F.n2(at)} / 2.0 needed</b></div>
        <div class="mt2" role="meter" aria-valuemin="0" aria-valuemax="3" aria-valuenow="${at.toFixed(2)}" aria-label="Signal strength ${F.n2(at)}; about 2 is needed to be reliable"><i style="width:${w}%"></i><u style="left:${1.96 / 3 * 100}%"></u></div>
        <div class="ml"><span style="left:0;transform:none">none</span><span style="left:${1.96 / 3 * 100}%">reliable</span></div></div>
      <div class="qq"><div><b>${F.pct1(t.Q1_CAGR)}</b>Top 20% / yr</div><div><b>${F.pct1(t.Q5_CAGR)}</b>Bottom 20% / yr</div><div><b>${F.n2(t.IC_p)}</b>${T("pvalue")}</div></div></article>`; }).join("")}</div>
  <section class="section teachgrid">
    ${teach("Rank IC", `Each month, rank stocks by score and by next month's return, then measure how well the two rankings agree. +1 is perfect, 0 is no link, −1 is perfectly backwards. Even good real-world factors only reach about 0.03–0.05.`)}
    ${teach("p-value", `The chance of seeing a link this strong if the factor were pure noise. A p-value of 0.80 means noise would do this well 80% of the time; researchers usually want below 0.05 before trusting a signal.`)}
  </section>`;
  return `<div class="head"><p class="eyebrow">Factor Tests · ${UNI_NAME[u.key]}</p><h1>Single-factor tests</h1>
  <p class="lede">Each price factor run through the same quintile backtest. ${T("ic", "Rank IC")} = Spearman correlation of score vs next-month return; ${T("tstat", "t")} and ${T("pvalue", "p")} from a one-sample t-test on the monthly IC series.</p></div>
  <div class="tablebox"><table aria-label="Single-factor test results"><thead><tr><th class="l stk" scope="col">Factor</th><th class="l" scope="col">Verdict</th><th scope="col">Mean IC</th><th scope="col">t-stat</th><th scope="col">p-value</th><th scope="col">Q1 CAGR</th><th scope="col">Q5 CAGR</th><th scope="col">${T("longshort", "L/S CAGR")}</th><th scope="col">Months</th></tr></thead>
  <tbody>${tests.map(t => { const [cls, txt] = verdict(t.IC_p); return `<tr><td class="l stk" style="font-family:var(--sans)">${esc((FT[t.factor] || {}).a || t.factor)}</td><td class="l" style="font-family:var(--sans)"><span class="verdict ${cls}" style="margin:0;font-size:13px;font-weight:500">${ico(cls)}${txt}</span></td><td>${F.n3(t.IC_mean)}</td><td>${F.n2(t.IC_t)}</td><td>${F.n3(t.IC_p)}</td><td>${F.pct1(t.Q1_CAGR)}</td><td>${F.pct1(t.Q5_CAGR)}</td><td>${F.pct1(t.LS_CAGR)}</td><td>${F.int(t.Months)}</td></tr>`; }).join("")}</tbody></table></div>
  <section class="card chartcard section"><div class="charthead"><div><h2>Monthly rank IC, composite</h2><p class="muted small">Bars = monthly IC; line = 12-month rolling mean. Mean ${F.n3(u.T.composite?.IC_mean)}, t = ${F.n2(u.T.composite?.IC_t)}.</p></div></div>
    <div class="legend"><span><i class="sq" style="background:var(--q1);opacity:.75"></i>Positive (scores right)</span><span><i class="sq" style="background:var(--q5);opacity:.75"></i>Negative (scores wrong way)</span><span><i class="ln" style="border-color:var(--ink)"></i>12-month mean</span></div>
    <div class="chart" id="ic-chart"></div></section>`;
};

/* ---------------- wiring ---------------- */
function postRender() {
  if (state.tab === "rankings" && !basic()) {
    rkBody();
    $("#rk-q").addEventListener("input", e => { state.rk.q = e.target.value; rkBody(); });
    $("#rk-sector").addEventListener("change", e => { state.rk.sector = e.target.value; rkBody(); });
    $("#rk-quint").addEventListener("change", e => { state.rk.quint = e.target.value; rkBody(); });
    $$("#p-rankings th[data-k] button").forEach(b => b.addEventListener("click", () => { const k = b.parentElement.dataset.k; if (state.rk.sort === k) state.rk.dir *= -1; else { state.rk.sort = k; state.rk.dir = RCOLS.find(c => c.k === k).s || k === "Rank" ? 1 : -1; } rkBody(); }));
  }
  if (state.tab === "lookup") lookupWire();
  if (state.tab === "space") spaceMount();
  if (state.tab === "tests" && !basic()) chartJob("#ic-chart", el => icChart(el, cur()));
}
function openStock(t) { state.stock = t; setTab("lookup"); }
document.addEventListener("click", e => { const b = e.target.closest("[data-open]"); if (b) { openStock(b.dataset.open); } });

function buildTabs() {
  $("#tabs").innerHTML = TABS.map(t => `<button type="button" class="tab" role="tab" id="t-${t.id}" aria-controls="p-${t.id}" data-tab="${t.id}">${ico(t.id)}<span class="lg">${t.lg}</span><span class="sm">${t.sm}</span></button>`).join("");
  $$(".tab").forEach(b => b.addEventListener("click", () => setTab(b.dataset.tab)));
  $("#tabs").addEventListener("keydown", e => {
    const i = TAB_IDS.indexOf(state.tab);
    if (e.key === "ArrowRight" || e.key === "ArrowLeft") { e.preventDefault(); const n = TAB_IDS[(i + (e.key === "ArrowRight" ? 1 : TAB_IDS.length - 1)) % TAB_IDS.length]; setTab(n); $("#t-" + n).focus(); }
  });
}
function syncChrome() {
  $$(".tab").forEach(b => { const on = b.dataset.tab === state.tab; b.setAttribute("aria-selected", on); b.tabIndex = on ? 0 : -1; });
  [["#seg-mode", state.mode], ["#seg-uni", state.uni]].forEach(([s, v]) => {
    const seg = $(s), bs = $$("button", seg), i = bs.findIndex(b => b.dataset.v === v);
    bs.forEach(b => b.setAttribute("aria-pressed", b.dataset.v === v)); seg.style.setProperty("--i", Math.max(0, i)); seg.style.setProperty("--n", bs.length);
  });
}
function setTab(t) {
  if (!TAB_IDS.includes(t)) return;
  state.tab = t; store.set("efl.tab", t); syncChrome();
  try { history.replaceState(null, "", "#" + t); } catch (e) {}
  render(); window.scrollTo({top: 0});
}
function bindSeg(sel, fn) { $$(sel + " button").forEach(b => b.addEventListener("click", () => fn(b.dataset.v))); }
bindSeg("#seg-mode", v => { if (v === state.mode) return; state.mode = v; store.set("efl.mode", v); syncChrome(); render(); });
bindSeg("#seg-uni", v => { if (v === state.uni || !U[v]) return; state.uni = v; store.set("efl.uni", v); if (!U[v].by[state.stock]) state.stock = null; state.rk.sector = ""; syncChrome(); render(); });
UNIS.length < 2 && ($("#seg-uni").style.display = "none");
$(".brand").addEventListener("click", e => { e.preventDefault(); setTab("overview"); });
addEventListener("hashchange", () => { const t = location.hash.slice(1); if (TAB_IDS.includes(t) && t !== state.tab) setTab(t); });
let rzT = 0, lastW = innerWidth;
addEventListener("resize", () => { clearTimeout(rzT); rzT = setTimeout(() => { if (innerWidth === lastW) return; lastW = innerWidth; hideTip(); chartJobs.forEach(f => f()); }, 160); });
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => { if (state.tab === "space") render(false); });

buildTabs(); syncChrome(); render();
</script>
</body>
</html>
