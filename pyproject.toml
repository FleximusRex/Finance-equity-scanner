[project]
name = "finance-equity-scanner"
version = "0.3.0"
description = "Multi-factor equity screener and backtest for the S&P 100 and S&P 500"
requires-python = ">=3.11"
authors = [{ name = "Sawyer Cross" }]
license = "MIT"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "BLE", "C4", "RUF"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# Broad catches here are deliberate: yfinance raises many exception types, and one bad
# ticker should be skipped and logged, not stop the run.
"src/data_loader.py" = ["BLE001"]
